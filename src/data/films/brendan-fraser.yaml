# New films for Brendan Fraser. Scales and anchors are in README.md ("The anchor rubric").
#
# Free wins (verified by matching tmdb_id): airheads (judd-nelson.yaml), glory-daze
# (ben-affleck.yaml), the-quiet-american (christopher-doyle.yaml), no-sudden-move
# (del-toro.yaml), killers-of-the-flower-moon (scorsese.yaml). Excluded: TV movies (Guilty Until
# Proven Innocent, Child of Darkness Child of Light, The Twilight of the Golds), uncredited bits
# (Son in Law, In the Army Now, Now and Then, Brain Candy, G.I. Joe: The Rise of Cobra),
# appearances as himself, narration, shorts, and the direct-to-video Sinbad: Beyond the Veil of
# Mists. Deferred: Dogfight (one-scene sailor), A Case of You (cameo), The Secret of Karma and
# Diamond (release unverified). Not yet released as of 2026-11-16: The Mummy sequel, Starman.
#
# Crash (2004) already exists in bullock.yaml — tagged before he had an entity. The Mummy
# (1999) already exists in weisz.yaml.

