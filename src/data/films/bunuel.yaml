# Films for Luis Buñuel. Scales and anchors are in README.md ("The anchor rubric").
#
# The corpus's clearest case for humor being independent of difficulty. The Discreet Charm and The
# Phantom of Liberty are opacity 5 and humor 4 simultaneously — structurally impossible to follow
# and consistently funny about it — which is exactly the combination a single difficulty slider
# cannot express and the reason the humor axis exists at all.

