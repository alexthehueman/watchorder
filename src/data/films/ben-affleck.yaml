# Films for Ben Affleck. Scales and anchors are in README.md ("The anchor rubric").
#
# Good Will Hunting already exists in damon.yaml. Armageddon already exists in buscemi.yaml.
# Argo already exists in goodman.yaml. Gone Girl already exists in pike.yaml. This pass adds
# further free wins Field of Dreams (Costner), School Ties (Brendan Fraser), Dazed and Confused
# (McConaughey), Shakespeare in Love (Dench), Dogma (Chris Rock), Boiler Room (Vin Diesel), Pearl
# Harbor (Beckinsale), Changing Lanes (Roger Michell), Gigli (Pacino), Hollywoodland (Brody), The
# Town (Jeremy Renner), The Company Men (Roger Deakins), To the Wonder (Malick), Runner Runner
# (Anthony Mackie), Batman v Superman and Zack Snyder's Justice League (both Amy Adams), Suicide
# Squad and Air (both Viola Davis), The Accountant (Kendrick), Live by Night and Clerks III (both
# Anthony Michael Hall), Justice League (Jason Momoa), The Last Duel (Adam Driver), Deep Water (Ana
# de Armas), and The Last Thing He Wanted (Hathaway), plus 30 new films below.
#
# Excluded as an uncredited bit part or documentary/deleted-scene appearance rather than a real
# performance: The Dark End of the Street, The Good Mother, Buffy the Vampire Slayer, Fahrenheit
# 9/11, Jennifer Lopez: Halftime, The Greatest Love Story Never Told, and Elektra (his cameo exists
# only in the director's cut, never theatrically released). Excluded as unreleased as of today:
# Animals.

