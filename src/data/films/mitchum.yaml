# Films for Robert Mitchum. Scales and anchors are in README.md ("The anchor rubric").
#
# The sleepy-eyed, unbothered affect he built a career on turns out to be load-bearing for exactly
# one thing: making Night of the Hunter's preacher genuinely terrifying, because the same
# unhurried calm that reads as cool everywhere else reads as inhuman when it is pointed at children.

