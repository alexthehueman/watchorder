# Films for Krzysztof Kieślowski. Scales and anchors are in README.md ("The anchor rubric").
#
# A Short Film About Killing and A Short Film About Love are the theatrical expansions of Dekalog
# episodes 5 and 6, not the full ten-part television series — including all ten episodes as
# separate "films" would pad the corpus with near-identical runtimes rather than reflect real
# theatrical viewing choices.
#
# Three Colours: Blue already existed in the corpus, tagged for Juliette Binoche.

