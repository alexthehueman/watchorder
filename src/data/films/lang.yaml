# Films for Fritz Lang. Scales and anchors are in README.md ("The anchor rubric").
#
# German silent epic and German early-sound thriller on one end, three Hollywood genre films after
# he fled the Nazis on the other — the same director, and the American work is not a lesser
# footnote to the European work, just a different kind of control over a smaller budget.

