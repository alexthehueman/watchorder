# New films for Benedict Cumberbatch. Scales and anchors are in README.md ("The anchor rubric").
#
# Tinker Tailor Soldier Spy (2011) already exists in oldman.yaml — tagged before he had an
# entity. 12 Years a Slave already exists in fassbender.yaml — tagged before he had an entity.
# This pass adds further free wins Atonement (Ronan), War Horse (Janusz Kaminski), The Hobbit: An
# Unexpected Journey (Peter Jackson), August: Osage County (Streep), Black Mass (Julianne
# Nicholson), Zoolander 2 (Stiller), Thor: Ragnarok (Blanchett), Avengers: Infinity War (Brolin),
# Avengers: Endgame (Angela Bassett), Between Two Ferns: The Movie (Awkwafina), Spider-Man: No Way
# Home (Garfield), Doctor Strange in the Multiverse of Madness (Olsen), The Wonderful Story of
# Henry Sugar (Ben Kingsley), Creation (Paul Bettany), Four Lions (Riz Ahmed), Amazing Grace
# (Albert Finney), and The Other Boleyn Girl (Garfield), plus 21 new films below.
#
# Poison needed a distinct id for his 2023 Wes Anderson Roald Dahl short, unrelated to Todd
# Haynes's 1991 film of the same title already in the corpus. Excluded as shorts or a
# documentary-narration credit rather than acting roles: Hills Like White Elephants, Inseparable,
# Little Favour, The Dog Days of Winter, and Girlfriend in a Coma. Excluded as unreleased as of
# today: Confessions II, How to Live on Earth, Avengers: Doomsday, Wife & Dog, and Blood on Snow.

