# John Carpenter. Scales and anchors are in README.md ("The anchor rubric").
#
# He is the corpus's stress test for the humor axis. Almost nothing here is opaque, several are
# genuinely bleak, and a good half are funny on purpose — which is a combination none of the other
# directors in the roster produce, and exactly the combination a difficulty-only schema would
# flatten into "easy".

