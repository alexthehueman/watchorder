# New films for Ben Stiller. Scales and anchors are in README.md ("The anchor rubric").
#
# Zoolander already exists in owen-wilson.yaml — tagged before he had an entity. The Royal
# Tenenbaums already exists in hackman.yaml. Tropic Thunder already exists in downey.yaml.
# Dodgeball already exists in vaughn.yaml. This pass adds further free wins Madagascar
# (DreamWorks Animation), Starsky & Hutch (Todd Phillips), Anchorman (Carell), Empire of the Sun
# (Spielberg), Reality Bites (Hawke), Happy Gilmore and Happy Gilmore 2 and Hubie Halloween and The
# Meyerowitz Stories (all Adam Sandler), The Cable Guy (Carrey), While We're Young (Noah
# Baumbach), Locked Down (Hathaway), Envy (Poehler), Bros (Amy Schumer), and The Marc Pease
# Experience (Kendrick), plus 34 new films below.
#
# Excluded as a short film (Shoeshine), a TV pilot (The Nutt House), and an uncredited-only cameo
# (Dear Santa) rather than credited feature-film roles.

