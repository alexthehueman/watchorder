# Films for Al Pacino not already in the corpus. The Godfather and The Godfather Part II arrived
# with Marlon Brando and Robert De Niro respectively; Heat arrives with De Niro too — Pacino and
# De Niro share a scene in it, famously their only one on screen together until decades later.
#
# Dick Tracy, The Godfather Part III, Carlito's Way, Donnie Brasco, Any Given Sunday, Two for the
# Money, Jack and Jill, Once Upon a Time in Hollywood, The Irishman and House of Gucci also already
# existed elsewhere. The films below fill out the rest of his real filmography per Wikipedia.
#
# Excludes Wilde Salomé (2011) — a documentary about staging the play, not the dramatic film itself
# (Salomé, 2013, is the actual feature and is included). Excludes Father Joe, Lear Rex and
# Maserati: The Brothers — all still unreleased as of this pass, unlike the other 2025-2026 titles
# below, which have confirmed premieres or theatrical dates that have already passed.

