# Hou Hsiao-hsien. Scales and anchors are in README.md ("The anchor rubric").
#
# His difficulty is historical rather than formal: the films assume Taiwanese history the way an
# English film assumes the war, and the opacity numbers largely track how much context a viewer is
# expected to arrive with. The early coming-of-age films assume almost none.

