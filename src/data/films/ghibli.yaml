# Miyazaki directed eight of these twelve. A path here is free to be mostly his — that is the
# studio's real shape, not something to correct for — and Takahata's films still win their place
# whenever they genuinely fit, on their own merits: The Tale of the Princess Kaguya is signature 5
# and carries an acclaim tagged higher than several Miyazaki entries, so it competes on its work,
# not on a reserved slot.

