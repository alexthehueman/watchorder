# The Witch already exists in a24.yaml — tagged before she had an entity. Split already exists in
# blumhouse.yaml — tagged before she had an entity. Emma. already exists in oconnor.yaml — tagged
# before she had an entity. This pass adds further free wins Glass (Paulson), Last Night in Soho
# (Edgar Wright), The Northman (Eggers), Amsterdam (Margot Robbie), and Dune: Part Two (Zendaya),
# plus 13 new films below.
#
# Excluded as documentaries/specials/shorts about her rather than acting roles: The Making of
# "Split", Love, Antosha, Cinderella: A Comic Relief Pantomime for Christmas, The Netflix
# Afterparty, Creating The Queen's Gambit, Highway to Valhalla, Mad Max and the Genius of George
# Miller, It's a Mad Max World, and Crossmaglen (a short film). Excluded as unreleased as of
# today: The Super Mario Galaxy Movie, Sacrifice, Dune: Part Three, The Lord of the Rings: The
# Hunt for Gollum, and the untitled Joni Mitchell biopic.

