# New films for Austin Butler. Scales and anchors are in README.md ("The anchor rubric").
#
# Dune Part Two already exists in zendaya.yaml — tagged before he had an entity. Once Upon a Time
# in Hollywood already exists in tarantino.yaml — tagged before he had an entity. This pass adds
# further free wins The Dead Don't Die (Adam Driver), Caught Stealing (Aronofsky), and Eddington
# (Aster), plus 9 new films below.
#
# The Bling Ring needed a distinct id — his 2011 Lifetime TV movie, unrelated to Sofia Coppola's
# 2013 theatrical film already in the corpus under Emma Watson despite sharing the exact title.
# Excluded as documentaries/specials about him or Elvis rather than acting roles: Made in
# Eddington, Just a Boy From Tupelo, Rock 'N Roll Royalty, Bigger Than Life, Fit for a King, Viva
# Australia, Exclusively Elvis, and 7 Secrets with Miranda Cosgrove. Excluded as unreleased/
# pre-production as of today: The Brigands of Rattlecreek, the untitled Lance Armstrong film,
# Enemies, The Barrier, American Speed, and City on Fire.

