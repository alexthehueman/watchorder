# Seven films already existed elsewhere in the corpus, tagged under an actor or director before
# this entity existed — see the entity file for the full list of sources. The rest of the
# animated-classics era had never been tagged anywhere: none of these titles carry a director or
# actor entity of their own in the corpus the way a live-action film usually does.
#
# The early titles here were originally distributed through RKO, not Buena Vista — Disney didn't
# run its own distribution until 1953 — but they were produced by Walt Disney Productions itself,
# which is the studio this entity is about. That's a different question from the Scarface/Psycho
# cases elsewhere in the corpus, where the production company itself belonged to someone else.

