# New films for Brian Cox. Scales and anchors are in README.md ("The anchor rubric").
#
# PARTIAL: his theatrical feature roles only. About half of his 200-odd credits are television
# films and serials (Sharpe, Longitude, Poodle Springs, The Lost Language of Cranes, Nuremberg
# and many BBC plays), documentaries and narration; none of those are included.
# Free wins (verified by matching tmdb_id): nicholas-and-alexandra (freddie-young.yaml), rob-roy
# (tim-roth.yaml), braveheart (mel-gibson.yaml), rushmore (murray.yaml),
# the-affair-of-the-necklace + fantastic-mr-fox (brody.yaml), the-ring (watts.yaml), 25th-hour
# (spike-lee.yaml), troy (pitt.yaml), red-eye (cillian-murphy.yaml), match-point
# (johansson.yaml), running-with-scissors (bening.yaml), zodiac (downey.yaml), red (mirren.yaml),
# coriolanus (gerard-butler.yaml), her (phoenix.yaml), pixels (adam-sandler.yaml), morgan
# (taylor-joy.yaml), that-christmas (nighy.yaml), the-electric-state (mackie.yaml).
# Excluded: The Bourne Ultimatum (archive voice, uncredited). Deferred: a few small independent
# films whose roles could not be confirmed (Merchants of Venus, All at Sea, Killing Thyme,
# Skelly, There Are No Saints, The Outsiders 2006, A Woman in Winter).
