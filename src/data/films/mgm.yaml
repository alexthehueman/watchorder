# Films for MGM. Scales and anchors are in README.md ("The anchor rubric").
#
# Bounded to the studio-system Golden Age — roughly 1924 to 1959 — on purpose. "MGM" only means
# one coherent thing inside that window: Thalberg's prestige ensembles, the Freed Unit musicals,
# Louis B. Mayer's "more stars than there are in heaven." Past 1959 the studio was sold, merged
# and reorganised so many times that the name stopped describing a house style at all — the same
# reasoning that keeps Cannon bounded to 1979-1989 rather than chasing the name through its later,
# unrelated owners.
#
# Two films are here specifically to break the glamour stereotype: a noir and a piece of science
# fiction. A studio remembered only for musicals and Garbo would be a caricature of MGM, not MGM.

