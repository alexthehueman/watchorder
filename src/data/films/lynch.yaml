# Every film, tagged once. Entities reference these by id; nothing here is entity-specific —
# `signature` and `gateway` live on the entity-film pair, in src/data/entities/*.yaml.
#
# Scale definitions and the named anchors for each point are in README.md ("The anchor rubric").
# When a tag here and the rubric disagree, the rubric wins or the rubric changes. The comments
# are load-bearing: a tag without a recorded reason is a number nobody can audit later.
#
# tmdb_id is null until `npm run ingest` resolves it by title and year. It is deliberately not
# hand-written — a guessed id silently points at the wrong film.

- id: eraserhead
  tmdb_id: null
  title: Eraserhead
  year: 1977
  runtime: 89
  tags:
    opacity: 5 # a rubric anchor for 5 — there is no stable reading to recover
    stillness: 4
    bleakness: 5
    humor: 2 # the deadpan chicken dinner is genuinely funny, and it is the only relief
    acclaim: 0.82
  content:
    sexual_violence: false
    animal_harm: false
    child_harm: true # the creature is framed as an infant; anyone filtering this wants it caught
    suicide: false
    violence: 1
    sex: 1
  imdb_id: tt0074486
