# Films for Daniel Day-Lewis not already in the corpus. There Will Be Blood and Phantom Thread
# arrived with Paul Thomas Anderson and are not repeated here — only the relationship is new.
#
# He made roughly twenty films in a forty-year career and was notoriously selective about all of
# them, so this list is close to comprehensive rather than a curated fraction of something larger.
#
# Nine films sits above MIN_CORPUS_FOR_SPREAD deliberately, not incidentally. At exactly seven the
# depth grid barely has room to differ — depth 6 and depth 12 select all but one film either way —
# which caps how much any tagging can spread the metrics regardless of how the values are set.
#
# Register reads narrow for him and should: he does not really do broad comedy or light fare, and
# his bleak roles are reliably his humourless ones. Forcing the two apart to chase the register
# metric would be inventing a range he does not have, which is worse than the metric failing
# honestly — see Haneke, Tarr and the others already accepted onto that list for the same reason.

