# Films for Jeanne Moreau. Scales and anchors are in README.md ("The anchor rubric").
#
# La Notte already exists in antonioni.yaml, tagged there for the director rather than either lead
# — she is the top-billed role in it, opposite Mastroianni. Jules and Jim exists in truffaut.yaml.
#
# The register spread here is unusually wide for one decade: Jules and Jim is warm bordering on
# reckless, La Notte is restrained to the point of shutdown, and Diary of a Chambermaid is quietly
# menacing. She worked with more major directors in the sixties than anyone else on the roster.

