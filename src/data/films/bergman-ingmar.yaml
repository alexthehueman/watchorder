# New films for Ingmar Bergman. Scales and anchors are in README.md ("The anchor rubric").
#
# Eleven of these fourteen films already existed in the corpus — tagged for Liv Ullmann, Max von
# Sydow and Ingrid Bergman, his three most important actors, all already full entities here. Only
# the three below are new, added because everything already tagged clusters in the 1957-1978
# window and a filmography missing both faith-trilogy bookends and his final epic is not the whole
# filmography.

