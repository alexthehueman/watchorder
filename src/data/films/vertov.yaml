# Films for Dziga Vertov. Scales and anchors are in README.md ("The anchor rubric").
#
# A small roster reflecting a genuinely small canon within a huge body of newsreel and propaganda
# work — these three are the ones still watched as films rather than as historical documents. Three
# Songs About Lenin is explicit Stalin-era hagiography, included for its place in documentary
# history rather than for the politics, which the content tags do not attempt to launder.

