# New films for Ben Gazzara. Scales and anchors are in README.md ("The anchor rubric").
#
# Opening Night already exists in rowlands.yaml. Anatomy of a Murder already
# exists in stewart.yaml. This pass adds further free wins The Big Lebowski (Coens), Buffalo '66
# (Huston), The Thomas Crown Affair (Pierce Brosnan), Road House (Patrick Swayze), Dogville
# (Kidman), Summer of Sam (Brody), and They All Laughed and Bloodline (both Audrey Hepburn), plus
# 26 new films below.
#
# Scope note: his 1980s-2011 international career has a long tail of obscure Italian and French
# films with no accessible Anglophone synopsis or reception info to tag content flags from with
# confidence — The Girl from Trieste, A Proper Scandal, Woman of Wonders, My Dearest Son, The
# Professor, Champagne amer, Beyond the Ocean, Forever, Sherwood's Travels, Swallows Never Die in
# Jerusalem, Nefertiti figlia del sole, The Dogfighters, Banditi, Farmer & Chase, Stag, Vicious
# Circles, Poor Liza, Believe, Home Sweet Hoboken, Very Mean Men, Undertaker's Paradise, The List,
# Nella terra di nessuno, L'ospite segreto, Bonjour Michel, Schubert, Eve, Holy Money, 13,
# Christopher Roth, Chez Gino, Ristabbànna, and If It's Tuesday, This Must Be Belgium, plus The
# Captive City and Scene of the Crime, whose TMDB ids couldn't be confidently located. Added only
# the well-documented films (PARTIAL scope); the rest deliberately deferred to a dedicated future
# pass. Excluded King: A Filmed Record as a documentary appearance rather than an acting role.

