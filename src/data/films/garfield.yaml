# New films for Andrew Garfield. Scales and anchors are in README.md ("The anchor rubric").
#
# Silence already exists in driver.yaml — tagged before he had an entity. This pass adds further
# free wins The Eyes of Tammy Faye (Chastain), Never Let Me Go (Mulligan) and Mainstream (Maya
# Hawke), plus 16 new films below.
#
# Excludes his large tail of documentaries, making-of featurettes and premiere specials (especially
# around the Spider-Man franchise), two National Theatre Live filmed-stage broadcasts of Angels in
# America, and a handful of shorts. Spider-Man: No Way Home is his real, substantial return to the
# role — included — but Spider-Man: Across the Spider-Verse is not: he has no involvement in that
# animated film, and the TMDB credit appears to be an error.

