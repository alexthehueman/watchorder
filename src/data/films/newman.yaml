# Films for Paul Newman. Scales and anchors are in README.md ("The anchor rubric").
#
# A useful corrective to how the roster tags American stardom. Almost every film here is a man
# who loses — the pool hustler, the chain-gang prisoner, the rancher's son, the alcoholic lawyer —
# and the bleakness values run 3 to 5 across a filmography sold on charm. The gap between what he
# was marketed as and what he actually chose is the entity.

