# New films for Bill Murray. Scales and anchors are in README.md ("The anchor rubric").
#
# Ghostbusters already exists in weaver.yaml (a genuine ensemble, and it's her franchise entry
# too) — tagged before he had an entity. The Grand Budapest Hotel already exists in fiennes.yaml
# (a supporting ensemble part) — tagged before he had an entity. This pass adds further free wins
# Tootsie (Hoffman), Ed Wood (Depp), The Darjeeling Limited (Jason Schwartzman), Get Smart (Alan
# Arkin), Fantastic Mr. Fox (Brody), Moonrise Kingdom (McDormand), Hyde Park on Hudson (Olivia
# Colman), The Monuments Men (Dujardin), St. Vincent (Melissa McCarthy), The Jungle Book (Ben
# Kingsley), Ghostbusters 2016 (Hemsworth), Isle of Dogs (Goldblum), The Dead Don't Die (Adam
# Driver), On the Rocks (Sofia Coppola), The French Dispatch (Chalamet), The Phoenician Scheme
# (Cumberbatch), Zombieland (Harrelson), and A Glimpse Inside the Mind of Charles Swan III
# (Aubrey Plaza), plus 32 new films below.
#
# Excluded uncredited appearances, cameos as himself, and documentaries about him rather than real
# roles: Next Stop, Greenwich Village, Mr. Mike's Mondo Video, Tarzoon: Shame of the Jungle, B.C.
# Rock, She's Having a Baby, Space Jam, and Michael Jordan to the Max.

