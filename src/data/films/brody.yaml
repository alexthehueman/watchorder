# New films for Adrien Brody. Scales and anchors are in README.md ("The anchor rubric").
#
# King Kong already exists in watts.yaml — tagged before he had an entity. The Grand Budapest
# Hotel already exists in fiennes.yaml — tagged before he had an entity. The Thin Red Line
# (malick.yaml), The Village (m-night-shyamalan.yaml), The Darjeeling Limited
# (jason-schwartzman.yaml), The Brothers Bloom (rian-johnson.yaml), Midnight in Paris
# (owen-wilson.yaml), The French Dispatch (chalamet.yaml), See How They Run (ronan.yaml), Blonde
# (de-armas.yaml) and Asteroid City (maya-hawke.yaml) likewise already existed. The films below
# fill out the rest of his real filmography per Wikipedia.
#
# Excludes Emperor (Charles V, dir. Lee Tamahori) — in limbo for over a decade, and even now its
# release status is genuinely unclear rather than confirmed. Add it once it actually has one.
#
# The corpus already has an unrelated film with id "clean" (cheung.yaml, Maggie Cheung's 2004
# Clean) — his 2021 Clean uses clean-2021 instead.

