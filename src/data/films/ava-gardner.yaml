# New films for Ava Gardner. Scales and anchors are in README.md ("The anchor rubric").
#
# Free wins: On the Beach and The Life and Times of Judge Roy Bean (both Anthony Perkins), Seven
# Days in May (Kirk Douglas), and Bhowani Junction (George Cukor) were already in the corpus under
# other entities, plus 38 new films below.
#
# Followed her Wikipedia filmography's own scope, excluding a batch of shorts and uncredited bit
# parts from 1941-1944 before her career took off — Fancy Answers, Strange Testament, Shadow of
# the Thin Man, H.M. Pulham Esq., Babes on Broadway, We Were Dancing, Joe Smith American, This
# Time for Keeps, We Do It Because, Kid Glove Killer, Sunday Punch, Calling Dr. Gillespie, Mighty
# Lak a Goat, Reunion in France, Young Ideas, and Blonde Fever — plus her later uncredited cameo
# as herself in The Band Wagon.

