# Films for Sidney Poitier. Scales and anchors are in README.md ("The anchor rubric").
#
# Guess Who's Coming to Dinner already exists in hepburn-katharine.yaml. He was the first Black
# actor to win the Best Actor Oscar and, for most of a decade, the only Black leading man Hollywood
# would finance — which is why so many of these films are explicitly about race rather than
# incidentally featuring him. That context is the entity; the roster would misrepresent him without it.

