# New films for Anjelica Huston. Scales and anchors are in README.md ("The anchor rubric").
#
# Prizzi's Honor already exists in nicholson.yaml (a genuine dual lead) — tagged before she had
# an entity. The Royal Tenenbaums already exists in hackman.yaml (a genuine dual lead) — tagged
# before she had an entity. This pass adds further free wins Isle of Dogs (Goldblum), 50/50
# (Kendrick), One Flew Over the Cuckoo's Nest (Nicholson), This Is Spinal Tap (Rob Reiner), The
# Life Aquatic with Steve Zissou (Murray), The Darjeeling Limited (Jason Schwartzman), The Player
# (Altman), A Handful of Dust (Guinness) and Casino Royale 1967 (Sellers), plus 41 new films below.
#
# Her real filmography runs to over 100 acting credits with an unusually heavy documentary/tribute
# tail even by this project's standards — this pass excludes all of it (Diana Vreeland, Jack
# Nicholson, Joan Crawford, John Huston, Wes Anderson tributes/portraits, several Making-of
# featurettes, awards specials), several shorts and short-format Disney Fairies TV specials (Pixie
# Hollow Bake Off, Pixie Hollow Games, Captain EO, Rabbit Ears - Rip Van Winkle), and Unity (2014,
# a documentary she narrates). The Postman Always Rings Twice needed a distinct id — her 1981
# remake, not the 1946 original already in the corpus.

