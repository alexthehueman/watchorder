# Butler) were already in the corpus under other entities, plus 17 new films below.
#
# Jackpot! and The Little Mermaid both needed distinct ids — her 2024 action-comedy and 2023
# live-action remake respectively, unrelated to the other "Jackpot!" already in the corpus under
# Paul Feig and the 1989 animated classic already in the corpus under Disney, despite sharing the
# exact titles.
#
# Excluded as documentaries/specials/making-ofs about her or a film rather than acting roles: Once
