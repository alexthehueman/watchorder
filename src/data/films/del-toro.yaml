# New films for Benicio del Toro. Scales and anchors are in README.md ("The anchor rubric").
#
# Sicario already exists in blunt.yaml — tagged before he had an entity. 21 Grams already exists
# in watts.yaml — tagged before he had an entity. This pass adds further free wins Fear and
# Loathing in Las Vegas (Depp), Snatch (Jason Statham), Guardians of the Galaxy (Saldana), Thor:
# The Dark World and The Wolfman (both Hopkins), Avengers: Infinity War (Brolin), Star Wars: The
# Last Jedi (Adam Driver), The French Dispatch (Chalamet), The Phoenician Scheme (Cumberbatch),
# Inherent Vice and One Battle After Another (both PTA), Licence to Kill (Timothy Dalton), and
# Basquiat (Jeffrey Wright), plus 26 new films below.
#
# Excluded a cameo as himself and two uncredited cameos as himself rather than acting roles:
# Cannes Man, Bread and Roses, and Somewhere.

