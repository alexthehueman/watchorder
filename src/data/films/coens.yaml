# Films for the Coen brothers. Scales and anchors are in README.md ("The anchor rubric").
#
# Blood Simple, Raising Arizona, Fargo and Burn After Reading are absent here on purpose — all four
# already exist in mcdormand.yaml, and the entity file references those copies. Fargo is the
# rubric's anchor for humor 3 and No Country its anchor for opacity 2, so both scales are pinned to
# this filmography from opposite ends, which is a good reason to be careful with the rest of it.

