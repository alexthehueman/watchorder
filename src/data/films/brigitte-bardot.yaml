# New films for Brigitte Bardot. Scales and anchors are in README.md ("The anchor rubric").
#
# Covers every credited film role from Manina (1952) to Colinot (1973), her last.
# Free wins (verified by matching tmdb_id): contempt (godard.yaml), viva-maria (moreau.yaml),
# famous-love-affairs + spirits-of-the-dead (delon.yaml), agent-38-24-36 (anthony-perkins.yaml).
# Excluded: uncredited bits (Les Dents longues), appearances as herself (Testament of Orpheus,
# Masculin Feminin, Dear Brigitte, It Happened All Night, Paparazzi, Marie Soleil), archive
# footage, and The Twelve Tasks of Asterix (not her voice).
#
# Contempt already exists in godard.yaml. Viva Maria! already exists in moreau.yaml.

