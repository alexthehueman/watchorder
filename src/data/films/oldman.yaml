# New films for Gary Oldman. Scales and anchors are in README.md ("The anchor rubric").
#
# Bram Stoker's Dracula already exists in coppola.yaml, and The Dark Knight in bale.yaml — both
# tagged before he had an entity. The range here is the whole point: the same actor plays a
# punk-rock suicide, a corrupt DEA agent, a campy space-opera villain, and the most restrained
# spymaster in English cinema, often within a few years of each other.

