# New films for Alan Arkin. Scales and anchors are in README.md ("The anchor rubric").
#
# Little Miss Sunshine already exists in carell.yaml. Argo already exists in
# goodman.yaml. Wait Until Dark already exists in hepburn-audrey.yaml. This pass adds free wins
# Gattaca (thurman.yaml), Edward Scissorhands (depp.yaml), The Rocketeer (timothy-dalton.yaml),
# Glengarry Glen Ross and Stand Up Guys (both pacino.yaml), and North (abe-vigoda.yaml) to the
# entity's films list, plus 61 new films below.
#
# Excludes shorts (That's Me, The Last Mohican, People Soup), The Making of Edward Scissorhands
# (BTS), a handful of documentaries/tributes about him (Sr., Alan Arkin: Live from the TCM
# Classic Film Festival, Naples '44, Starring Sigmund Freud), his blink-and-gone Muppets cameo,
# and Calypso Heat Wave (1957) — his real film debut, but no verifiable tmdb_id found this pass;
# worth a second look. Distinct ids given to Dumbo (2019, vs. the 1941 original already in the
# corpus) and Indian Summer (1993, vs. Delon's 1972 French film of the same title).

