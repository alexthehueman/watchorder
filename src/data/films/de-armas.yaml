# Blade Runner 2049 already exists in gosling.yaml — tagged before she had an entity. Knives Out
# already exists in shannon.yaml — tagged before she had an entity. War Dogs already exists in
# hill.yaml — tagged before she had an entity. This pass adds a free win, Ghosted (Brody), plus 18
# new films below.
#
# Excludes two shorts (Perrito Chino, Ánima) and every still-unreleased title on her TMDB page
# (Palm Grove, Sweat, Impunity, Reenactment, Deeper — none have a release date yet), plus a
# making-of featurette. The Informer (2019) needed a distinct id from the corpus's existing
# the-informer — John Ford's own 1935 classic of the same title, an unrelated film that happens to
# share the exact title.

