# New films for Aubrey Plaza. Scales and anchors are in README.md ("The anchor rubric").
#
# Ingrid Goes West already exists in neon.yaml — tagged before she had an entity. This pass adds
# further free wins Scott Pilgrim vs. the World (Cera), Funny People (Sandler), Megalopolis (Adam
# Driver), Mike and Dave Need Wedding Dates and Life After Beth (both Kendrick), 10 Years (Anthony
# Mackie), and Playing It Cool (also Mackie), plus 23 new films below.
#
# Followed her Wikipedia filmography's own scope, which excludes an enormous tail of shorts,
# documentaries and specials about her (Megadoc, SNL50, Marvel Studios Assembled, Sarah Cooper:
# Everything's Fine, The Pistol Shrimps, and many more), plus unreleased/post-production titles
# (Animal Friends, The Accompanist, The Ark and the Aardvark).

