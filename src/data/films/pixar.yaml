# Films for Pixar. Scales and anchors are in README.md ("The anchor rubric").
#
# Fourteen films across 1995-2022 — not era-bounded the way MGM or Cannon are, because there is no
# ownership churn to bound around. The eras here instead trace a real internal arc: the founding
# run that had to prove computer animation could carry real drama, the more emotionally ambitious
# run once that was settled, and the pandemic run that skipped theatres for Disney+ entirely.
#
# Opacity sits at 1 for nearly everything on purpose, not from a lazy pass — these are films built
# to be legible to children, and forcing false ambiguity into the tags to manufacture spread would
# be less honest than the axis reading quiet here. Bleakness is where the real range lives: Up's
# opening and WALL-E's loneliness sit much closer to Chinatown than to Cinema Paradiso, despite the
# studio's reputation for warmth.

