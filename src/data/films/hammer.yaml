# Films for Hammer. Scales and anchors are in README.md ("The anchor rubric").
#
# The core roster is bounded to 1957-1974 — the Cushing-and-Lee Gothic run, mirroring how Cannon
# stays bounded to 1979-1989 rather than chasing a name through decades it no longer describes.
# One film breaks that bound on purpose: The Woman in Black (2012), the studio's modern revival,
# included specifically to show the house style survived the forty-year gap largely intact —
# atmosphere and dread over gore, right down to the ending that refuses anyone a way out.

