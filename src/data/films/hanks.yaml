# New films for Tom Hanks. Scales and anchors are in README.md ("The anchor rubric").
#
# Philadelphia, Saving Private Ryan and Catch Me If You Can already exist in washington.yaml and
# spielberg.yaml — three of his most significant roles, tagged before he had an entity.
#
# Cloud Atlas is the genuine outlier the rest of this roster lacks — six interwoven timelines with
# no throughline explained, playing multiple roles across centuries. Nothing else here is remotely
# that structurally demanding.

