# Aliens already exists in weaver.yaml — tagged before he had an entity.
# True Lies already exists in arnold-schwarzenegger.yaml. Free wins (verified by matching
# tmdb_id): stripes (murray.yaml), the-terminator + commando (arnold-schwarzenegger.yaml),
# weird-science (anthony-michael-hall.yaml), near-dark (lance-henriksen.yaml), trespass
# (ice-cube.yaml), tombstone (val-kilmer.yaml), titanic (dicaprio.yaml), a-simple-plan
# (sam-raimi.yaml), indian-summer-1993 + million-dollar-arm (alan-arkin.yaml), next-of-kin
# (stiller.yaml), thunderbirds (ben-kingsley.yaml), haywire (banderas.yaml), edge-of-tomorrow
# (blunt.yaml), nightcrawler (gyllenhaal.yaml), the-circle (watson.yaml). Disambiguated
# resistance-2003 (a later, unrelated Resistance may
# exist elsewhere) and indian-summer-1993 (a same-titled but different 1996 UK film is already
# in nighy.yaml as alive-and-kicking-1996). Excluded Crazy Mama (uncredited), Ghosts of the
# Abyss (documentary, appears as himself/narrator, not an acting role), and Magnificent
# Desolation (documentary short). Deferred: Night Warning / Butcher, Baker, Nightmare Maker
# (1981, no verified tmdb_id found with confidence) and Future Shock (1994 anthology, segment
# uncertain).

