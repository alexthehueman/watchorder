# New films for Anthony Perkins. Scales and anchors are in README.md ("The anchor rubric").
#
# Psycho already exists in hitchcock.yaml. The Trial already exists in welles.yaml. This pass
# adds further free wins Catch-22 (Alan Arkin) and Is Paris Burning? (Delon), plus 47 new films
# below.
#
# Les Misérables needed a distinct id for his 1978 TV movie, unrelated to the 2012 musical already
# in the corpus under another entity despite sharing the exact title. Murder on the Orient Express
# (his actual 1974 Lumet film) turned out to already exist as a free win in bergman-ingrid.yaml,
# verified via matching tmdb_id. Excluded as a documentary
# featurette rather than an acting role: The Last of Sheila Featurette. Excluded as a TV episode
# rather than a feature film: The Male Animal (a lost 1968 BBC Play of the Month).

