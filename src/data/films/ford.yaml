# Films for John Ford. Scales and anchors are in README.md ("The anchor rubric").
#
# The bleakness values are the ones to watch here. Ford's reputation is warmth and community, and
# three or four of these are genuinely that — but The Searchers ends with a man left outside the
# door on purpose, and Liberty Valance is about a lie everyone agreed to print. Tagging the whole
# filmography as comfortable would be repeating the reputation rather than describing the films.

