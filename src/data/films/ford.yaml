# Three added because the ten above were all shot in the same legible register and left M7 with
# almost nothing to measure. These are where Ford is genuinely not that: The Informer is German
# expressionism with fog and shadows, Long Voyage Home is O'Neill filmed as abstraction, and
# 7 Women is a bleak chamber piece he ended his career on.
