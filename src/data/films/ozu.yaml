# New films for Yasujirō Ozu. Scales and anchors are in README.md ("The anchor rubric").
#
# Six of these twelve films already existed in the corpus, tagged for Setsuko Hara, his definitive
# collaborator and already a full entity here. Only the six below are new, chosen specifically to
# add the range her filmography alone does not cover: a silent-era comedy, his funniest film, and
# the swan song he made after she had already stopped acting.

