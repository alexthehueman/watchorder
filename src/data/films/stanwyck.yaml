# New films for Barbara Stanwyck. Scales and anchors are in README.md ("The anchor rubric").
#
# Double Indemnity and Ball of Fire already exist in wilder.yaml and hawks.yaml — two of her most
# famous performances, tagged before she had an entity.
#
# The register field earns its keep here more than almost anywhere else on the roster: she moves
# from menacing (Double Indemnity, The Strange Love of Martha Ivers) to comic (The Lady Eve, Ball
# of Fire) to warm (Stella Dallas) across the same decade, often the same year.

