# New films for Marilyn Monroe. Scales and anchors are in README.md ("The anchor rubric").
#
# Gentlemen Prefer Blondes already exists in hawks.yaml, Some Like It Hot in wilder.yaml, and All
# About Eve in davis.yaml (Bette Davis is the lead there) — three of her most consequential roles,
# tagged before she had an entity.
#
# The Asphalt Jungle is a tiny part — she's barely in it — but it's the film that got her noticed at
# all, and The Misfits is the opposite end entirely: her last completed film, and the one where the
# persona built by the others finally cracks open.

