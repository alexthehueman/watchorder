# New films for Anthony Michael Hall. Scales and anchors are in README.md ("The anchor rubric").
#
# The Breakfast Club and Sixteen Candles already exist in molly-ringwald.yaml.
# Edward Scissorhands already exists in depp.yaml. This pass adds further free wins The Dark
# Knight (Bale), Foxcatcher (Carell), National Lampoon's Vacation (Chevy Chase), and Six Degrees
# of Separation (Will Smith), plus 15 new films below.
#
# Scope note: his post-2000 career is dominated by a very long tail of obscure direct-to-video
# genre pictures and TV movies (Air Force One Down, The Class, Something About Her, Zombie Night,
# Dead in Tombstone, Friend Request, Sexy Evil Genius, Aftermath, Sincerely Yours, Final Approach,
# LA Blues, Funny Valentine, Les Vampyres, The Photographer, A Touch of Hope, Dirt Merchant,
# Revenge, The Killing Grounds, Cold Night Into Dawn, Exit in Red, Hijacked: Flight 285, Texas,
# Who Do I Gotta Kill?, Hail Caesar, Running Out, Rascals and Robbers, and several unreleased/
# unclear 2025 titles) with no accessible synopsis or reception info to tag content flags from
# with confidence. Added only the well-documented ones; the rest deliberately deferred to a
# dedicated future pass rather than guessed. Excluded as documentaries/shorts/specials about him
# rather than acting roles: Celebrating Sixteen Candles, Inside Story: National Lampoon's
# Vacation, Whatever Happened to Mason Reese, SNL50: The Homecoming Concert, and The Gold Bug (no
# verifiable release info at all).

