# Agnès Varda. Scales and anchors are in README.md ("The anchor rubric").
#
# The roster's warm end, and deliberately so — with Haneke, Tarr and Tsai in the corpus, a
# register question needs something at the other extreme or it only ever asks how much misery you
# can take. Note Le Bonheur: the sunniest-looking film here and among the bleakest, which is
# exactly the separation between bleakness and difficulty the rubric insists on.

