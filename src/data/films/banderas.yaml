# New films for Antonio Banderas. Scales and anchors are in README.md ("The anchor rubric").
#
# Desperado already exists in hayek.yaml — tagged before he had an entity. Philadelphia already
# exists in washington.yaml — tagged before he had an entity. This pass adds further free wins
# The Skin I Live In and Women on the Verge of a Nervous Breakdown (both Almodovar), Evita
# (Darius Khondji), Interview with the Vampire (Dunst), Spy Kids (Robert Rodriguez), Frida and
# Once Upon a Time in Mexico (both Hayek), Four Rooms (Tim Roth), Knight of Cups (Malick),
# Uncharted (Holland), Life Itself and Ruby Sparks (both Bening), Shrek the Third (Poehler), You
# Will Meet a Tall Dark Stranger (Hopkins), And Starring Pancho Villa as Himself (Alan Arkin),
# Bullet Head (Brody), and Original Sin (Jolie), plus 58 new films below.
#
# Scope note: his pre-fame 1982-1992 Spanish output has a tail of very obscure titles (mostly
# minor roles in Spanish TV and cinema from before Women on the Verge made him internationally
# known) with no accessible Anglophone synopsis or reception info to tag content flags from with
# confidence — Réquiem por un campesino español, The Court of the Pharaoh, Puzzle, 27 Hours, Love
# Ravings, Baton Rouge, El placer de matar, El acto, Pestañas postizas, Caso cerrado, El señor
# Galíndez, El caso Almería, Y del seguro... líbranos, Señor!, The Way They Were, Terra Nova, Una
# mujer bajo la lluvia, Going Down in Morocco, The White Dove, If They Tell You I Fell, and The
# Stilts. Deliberately deferred to a dedicated future pass rather than guessed.

