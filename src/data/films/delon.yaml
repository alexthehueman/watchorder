# Films for Alain Delon. Scales and anchors are in README.md ("The anchor rubric").
#
# Purple Noon and Plein Soleil are the same 1960 film under its French and English titles — listed
# once, as Purple Noon, the title most databases use. Rocco and His Brothers and The Leopard already
# exist as Visconti-adjacent additions here for the first time; nobody else on the roster has tagged
# either yet.
#
# The stillness values run unusually high for a filmography this well-known — Melville in particular
# built entire films around him saying almost nothing, which the register field alone cannot capture
# and stillness is doing real work to record.
#
# 55 films added below to complete the real Wikipedia filmography. letterboxd_slug is deliberately
# left unset on all of them — hand-guessing it at authoring time is exactly how five separate wrong
# links slipped into this corpus (Ray, The Fighter, The Informant, The Bank Job, Nineteen Eighty-
# Four). `npm run ingest:letterboxd` verifies title+year+director against the live page before ever
# writing a slug; it runs after this file is committed, not before.
#
# Excludes, per the standing rule plus judgment calls made this pass:
#   - Shorts: Le Rapt (1949), Le journal d'un combat (1964), La planète des hommes (1971),
#     Les pros (1986), and several making-of/compilation pieces on his TMDB page.
#   - Producer-only, no acting role: Sortie de secours (1970), Power Play (1978), Le jeune marié
#     (1983).
#   - Uncredited: Redhead (1962), Carom Shots (1963), Ho! (1968), Fantasia Among the Squares
#     (1971), There Once Was a Cop (1971) — too minor to be why anyone watches this filmography.
#   - Playing himself in a cameo, not a role: One Hundred and One Nights (1994), Actors (1999),
#     Mommies, Happy New Year! (2012), Disclaimer (2019).
#   - Dozens of documentaries about him, Melville, Romy Schneider, Belmondo etc. (his TMDB page
#     lists many, almost entirely post-2008 retrospectives/tributes).
#   - The Many Faces of Zorro (2000), Reporters (1980), Le Bel Indifférent (1977), Bambi (1987) —
#     each ambiguous enough (compilation, interview-subject documentary, TV monologue piece, and an
#     unverifiable credit respectively) that they're left out rather than guessed into the corpus.
#     Worth a second look if anyone wants to chase them down individually.

