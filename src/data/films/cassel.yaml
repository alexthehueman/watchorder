# Films for Vincent Cassel. Scales and anchors are in README.md ("The anchor rubric").
#
# Eastern Promises is shared with cronenberg.yaml — referenced here rather than re-tagged. He plays
# Kirill, not the Viggo Mortensen lead, which is why role_size is supporting there despite the film's
# prominence.
#
# Two corrections worth recording because they were easy to get backwards: in Dobermann he plays the
# title character, the gang leader — not the cop chasing him (that's Tchéky Karyo). In Brotherhood of
# the Wolf he plays Jean-François de Morangias, the jealous, scheming brother — not Mani, the Mohawk
# tracker (that's Mark Dacascos). Both are easy to misremember from poster billing alone.
#
# Mesrine is a two-part biopic filmed and released as a genuine continuation, not two self-contained
# films — Public Enemy No. 1 picks up mid-story and assumes Killer Instinct's ending. The prereq on
# the entity file is hard for exactly that reason.

