# New films for Ben Kingsley. Scales and anchors are in README.md ("The anchor rubric").
#
# Schindler's List already exists in spielberg.yaml. Sexy Beast already exists in jonathan-glazer.yaml.
# House of Sand and Fog already exists in roger-deakins.yaml. Shutter Island already exists in
# von-sydow.yaml. Hugo already exists in moretz.yaml. This pass adds further free wins Bugsy
# (Bening), Dave (Kevin Kline), Sneakers (searching-for-bobby-fischer's Conrad Hall is unrelated —
# Sneakers itself has no prior corpus entry, added below), Searching for Bobby Fischer (Conrad
# Hall), Knight of Cups (Malick), Life (Ferguson), Shang-Chi (Awkwafina), Desert Warrior (Anthony
# Mackie), Collide (Hopkins), and Security (Banderas), plus 43 new films below.
#
# The Jungle Book needed a distinct id for his 2016 live-action role, unrelated to the 1967
# animated classic already in the corpus under Disney despite sharing the exact title.
#
# Scope note: his 87-credit career has a long tail of obscure UK TV movies, documentaries,
# narration work, and low-budget genre pictures from the 1980s-2020s with no accessible synopsis
# or reception info to tag content flags from with confidence — Harem, Turtle Diary, Pascali's
# Island, Testimony, Slipstream, The 5th Monkey, A Violent Life, Necessary Love, Freddie as F.R.O.7,
# Twelfth Night, The Assignment, Photographing Fairies, The Confession, Parting Shots, CNN
# Millennium, Spooky House, Islam: Empire of Faith, Triumph of Love, China's Stolen Children,
# Noah's Ark: The New Beginning, Journey to Mecca, Teen Patti, 1001 Inventions and the Library of
# Secrets, The Desert of Forbidden Art, Beatles Stories, A Therapy, A Common Man, A Birder's Guide
# to Everything, All Hail the King, War Story, Unity, Dragonheart 3, An Ordinary Man, Backstabbing
# for Beginners, Night Hunter, Intrigo: Death of an Author, Poison, William Tell, The King of
# Kings, Young Washington, Fortitude, Sonic the Hedgehog 4, The Way of the Wind, Walking with the
# Enemy, and The Ottoman Lieutenant (the latter two had no locatable tmdb_id), plus Fear Is the
# Key (1972). Deliberately deferred rather than guessed. Excluded Deep Water (2026) as unreleased
# as of today.

