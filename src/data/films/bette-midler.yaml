# New films for Bette Midler. Scales and anchors are in README.md ("The anchor rubric").
#
# The First Wives Club already exists in keaton-diane.yaml — tagged before she had an entity.
# This pass adds further free wins Get Shorty (Delroy Lindo), Hawaii (von Sydow), and Stella
# (Ben Stiller), plus 26 new films below.
#
# The Addams Family and The Women both needed distinct ids — her 2019 animated voice role and 2008
# remake respectively, unrelated to the 1991 live-action classic already in the corpus under
# Anjelica Huston and the 1939 original already in the corpus under Joan Crawford, despite sharing
# the exact titles.
#
# Excluded as an uncredited cut scene rather than a real role: Goodbye, Columbus. Excluded as
# concert films, documentaries, or TV specials about her rather than acting roles: Divine Madness
# and the dozens of "Bette Midler: ..." self-titled concert specials and music documentaries
# spanning her career, plus Hocus Pocus 3 as unreleased.

