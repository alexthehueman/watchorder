# New films for Marcello Mastroianni. Scales and anchors are in README.md ("The anchor rubric").
#
# La Dolce Vita, 8½ and City of Women already exist in fellini.yaml, and La Notte in
# antonioni.yaml — the four films that made him, all tagged before he had an entity. Only the
# films below are new.
#
# Worth stating because the entity depends on it: his persona is the opposite of what the roster's
# other leading men carry. Everyone else plays competence; he plays a man who cannot manage his own
# life and is charming about it, which is why the humor values run high for a dramatic actor.

