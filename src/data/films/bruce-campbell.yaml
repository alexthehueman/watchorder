# escape-from-la (carpenter.yaml), spider-man (dafoe.yaml), spider-man-2 + spider-man-3
# (jk-simmons.yaml), serving-sara (amy-adams.yaml), cloudy-with-a-chance-of-meatballs
# (hader.yaml), doctor-strange-in-the-multiverse-of-madness (olsen.yaml). Excluded: TV movies
# (Tornado!, The Love Bug, Goldrush, Terminal Invasion, Alien Apocalypse, Touch the Top of the
# World, Burn Notice: The Fall of Sam Axe and others), the Super-8 shorts of the 1970s,
# uncredited bits and soap-opera-on-a-TV gags (Fargo, Intolerable Cruelty, The Ladykillers, Evil
# Dead 2013, Evil Dead Rise), The Quick and the Dead (scene cut), documentaries and appearances
# as himself. Deferred: The Escort (no usable Letterboxd page), Aqua Teen Hunger Force, Timequest,
# Eddie Presley. Not confirmed released as of 2026-11-16: Ernie & Emma.

