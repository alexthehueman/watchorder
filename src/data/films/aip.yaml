# Films for American International Pictures. Scales and anchors are in README.md ("The anchor
# rubric").
#
# Bounded to 1957-1973 — the run from the founders' original drive-in double-bill formula through
# the Corman-Poe cycle, the youth-market pivots (beach party, biker, counterculture) and the early
# blaxploitation crossover, before the company drifted into the 1970s slate that eventually became
# Filmways. Acclaim stays honest and low for the cheapest entries on purpose — the same principle
# Cannon's file states outright: the story earns the inclusion, not a rewritten critical reputation.

