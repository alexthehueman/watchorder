# Films for Roger Deakins. Scales and anchors are in README.md ("The anchor rubric").
#
# Fargo already exists in mcdormand.yaml. Barton Fink, O Brother Where Art Thou, The Man Who
# Wasn't There, No Country for Old Men and True Grit already exist in coens.yaml. Skyfall already
# exists in fiennes.yaml. Prisoners already exists in jackman.yaml. Sicario already exists in
# blunt.yaml. Blade Runner 2049 already exists in gosling.yaml. The Shawshank Redemption already
# exists in morgan-freeman.yaml. 1917 already exists in scott.yaml. The Reader already exists in
# winslet.yaml.
#
# Cross-checked in full against his own official filmography (rogerdeakins.com/filmography), not
# just Wikipedia's summary, after Wikipedia's page turned out to omit his entire parallel career as
# a visual consultant on DreamWorks/Pixar animation (WALL-E, the How to Train Your Dragon trilogy,
# Rango, The Croods, Rise of the Guardians) plus most of his 1980s British features. How to Train
# Your Dragon, The Croods and WALL-E already exist in dreamworks-animation.yaml/pixar.yaml. Left
# out only the true shorts, documentaries and TV movies from his official list (Dinner with
# Friends, Return to Waterloo, The House, and the 1977-1983 British documentary/short work).

