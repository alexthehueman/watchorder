# Films for Gong Li. Scales and anchors are in README.md ("The anchor rubric").
#
# Her early filmography is almost entirely Zhang Yimou, made under China's strictest censorship
# period — several of these were banned domestically on release and only found audiences abroad.
# The bleakness values reflect films that had no path to a comfortable ending even before the
# censors got involved.

