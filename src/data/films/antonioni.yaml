# Films for Michelangelo Antonioni. Scales and anchors are in README.md ("The anchor rubric").
#
# A filmography where the opacity is never noise: things happen and are simply not resolved, on
# purpose and at feature length. L'Avventura loses a woman in the first act and declines to find
# her, which is the clearest statement of intent in postwar cinema.

