# Films for Alan Rickman. Scales and anchors are in README.md ("The anchor rubric").
#
# Harry Potter and the Goblet of Fire already exists in fiennes.yaml. Harry Potter
# and the Deathly Hallows Part 2 already exists in watson.yaml. Die Hard already
# exists in bruce-willis.yaml. Sense and Sensibility already exists in winslet.yaml.
# Truly Madly Deeply below is his own — his breakout leading role, outside both corpora.
#
# This pass completes the rest of the Harry Potter series (five more entries) plus his other real
# film work, adding free wins Love Actually (thompson.yaml), Dogma (chris-rock.yaml) and The
# Butler (whitaker.yaml). Excludes: his large tail of documentaries, tributes and making-of
# featurettes (his TMDB page lists over a dozen); TV specials (the Victoria Wood pieces, several
# one-off stage-performance broadcasts); "Play" (2001), a short Beckett adaptation; and Die Hard:
# With a Vengeance (1995) — his TMDB credit for it is a database error, he does not actually
# appear in that film.

