# New films for Anthony Hopkins. Scales and anchors are in README.md ("The anchor rubric").
#
# The Elephant Man already exists in lynch.yaml — tagged before he had an entity. Hannibal is a
# direct narrative sequel to The Silence of the Lambs, not a self-contained return to the character —
# the entity's prereqs reflect that. This pass adds further free wins Thor and Thor: Ragnarok
# (Hemsworth, Blanchett), Amistad (Hounsou), Beowulf (Jolie), Howards End (Thompson), Bram Stoker's
# Dracula (Coppola), Legends of the Fall (John Toll), The Mask of Zorro (Banderas), Noah (Russell
# Crowe), Alexander (Jolie), and Armageddon Time (Hathaway), plus 73 new films below.
#
# All the King's Men and The Hunchback of Notre Dame both needed distinct ids — his 2006 remake
# and 1982 TV movie respectively, unrelated to the 1949 original and 1939 classic already in the
# corpus under other entities despite sharing the exact title.

