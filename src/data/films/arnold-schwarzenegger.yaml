# New films for Arnold Schwarzenegger. Scales and anchors are in README.md ("The anchor rubric").
#
# Free wins: The Expendables and The Expendables 3 (Stallone/Banderas), Twins (DeVito), Conan the
# Barbarian (von Sydow), Dave (Kevin Kline), Kindergarten Cop (Ivan Reitman), Last Action Hero
# (Anthony Quinn), Terminator Genisys (Lee Byung-hun), and The Long Goodbye (Sterling Hayden) were
# already in the corpus under other entities, plus 28 new films below.
#
# Followed his Wikipedia filmography's own scope precisely, which excludes an enormous tail of
# self-appearance documentaries, "making of" featurettes, TV specials, WWE appearances, and
# disputed/uncredited bit parts (Beretta's Island, Strong-Thing, This Is America, Happy
# Anniversary and Goodbye, The Kid & I, The Jayne Mansfield Story, Christmas in Connecticut, Iron
# Mask) as well as his 1992 TV documentary "Lincoln" (an unrelated project from Spielberg's 2012
# film already in the corpus under Day-Lewis) and unreleased titles (Breakout, The Man with the
# Bag, Predator: Killer of Killers). WEAKEND is an unrelated experimental short remixing footage
# from The 6th Day, not a role of his.

