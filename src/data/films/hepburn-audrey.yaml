# New films for Audrey Hepburn. Scales and anchors are in README.md ("The anchor rubric").
#
# Filename disambiguates from hepburn-katharine.yaml, which was already here. Two unrelated Hepburns
# is exactly the collision the ray-satyajit.yaml naming was guarding against.
#
# Sabrina already exists in wilder.yaml and Charade in grant.yaml. Wait and Two for the Road are the
# reason this entity is not a one-note comfort listing — the persona is warmth, and twice she is
# cast directly against it. This pass adds further free wins Green Mansions (Anthony Perkins) and
# The Lavender Hill Mob (Guinness), plus 13 new films below.
#
# Excluded as uncredited bit parts rather than real roles: Dutch in Seven Lessons and One Wild Oat.

