# Films for Jean Renoir. Scales and anchors are in README.md ("The anchor rubric").
#
# The two towering, inseparable masterpieces — La Grande Illusion and La Règle du Jeu — sit either
# side of the biggest tonal swing in the roster: a POW-camp drama about class dissolving across
# enemy lines, then two years later a country-house farce where the same class closes ranks again
# and lets a man die for it.
#
# The Golden Coach already exists in magnani.yaml (Anna Magnani stars in it) — referenced here
# rather than re-tagged. Added because opacity sat at 1 across six of the other seven films — too
# uniform to move anything on its own, and this genuine outlier was already sitting in the corpus.

