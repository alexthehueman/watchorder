# New films for Angela Bassett. Scales and anchors are in README.md ("The anchor rubric").
#
# Black Panther already exists in michael-b-jordan.yaml — tagged before she had an entity.
# Black Panther Wakanda Forever already exists in nyongo.yaml. Malcolm X already exists in
# washington.yaml. This pass adds further free wins Mission: Impossible - Fallout (Cruise),
# Bumblebee (Steinfeld), Olympus Has Fallen (Leo), Contact (Foster) and Kindergarten Cop (Ivan
# Reitman), plus 34 new films below.
#
# Excludes Wildwood (2026, not yet released), an uncredited voice-only cameo in Mr. & Mrs. Smith
# (2005), and roughly ten obscure early-1990s TV movies (Locked Up: A Mother's Rage, Fire! Trapped
# on the 37th Floor, Line of Fire: The Morris Dees Story, The Heroes of Desert Storm, One Special
# Victory, Perry Mason: The Case of the Silenced Singer, In the Best Interest of the Child,
# Challenger, Liberty, Doubletake) with essentially no accessible synopsis or reception information
# to tag content flags from with real confidence — deferred to a dedicated future pass rather than
# guessed. Notorious (2009) needed a distinct id from an unrelated 1946 Hitchcock film of the same
# title already in the corpus.

