# New films for Barry Keoghan. Scales and anchors are in README.md ("The anchor rubric").
#
# Dunkirk already exists in cillian-murphy.yaml — tagged before he had an entity. This pass adds
# further free wins The Batman (Pattinson), plus 18 new films below.
#
# Bird and Stalker both needed distinct ids — his 2024 Andrea Arnold film and 2012 Irish thriller
# respectively, unrelated to the 1988 Clint Eastwood Charlie Parker biopic already in the corpus
# under Whitaker and Tarkovsky's 1979 sci-fi classic already in the corpus, despite sharing the
# exact titles. Excluded as shorts rather than features: Stand Up Bully, Wasted, North, The Break,
# and Candy Floss. Excluded as documentaries/specials/junket pieces: On the Red Carpet Presents:
# The Banshees of Inisherin and Marvel Studios Assembled: The Making of Eternals. Excluded as
# unreleased as of today: Butterfly Jam, Lemonade, Peaky Blinders: The Immortal Man, Crime 101,
# and The Beatles biopic quartet.

