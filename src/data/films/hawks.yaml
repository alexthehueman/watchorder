# Films for Howard Hawks. Scales and anchors are in README.md ("The anchor rubric").
#
# Four of his best are absent here because they already exist: Bringing Up Baby in
# hepburn-katharine.yaml, His Girl Friday in grant.yaml, To Have and Have Not and The Big Sleep in
# bogart.yaml. Hawks is the strongest evidence yet for the shared film table — he worked with
# everyone, so a third of his filmography arrives already tagged.
#
# Note the id: scarface-1932, because scarface is taken by the 1983 film in pacino.yaml. Same title,
# unrelated films, fifty-one years apart.

