# New films for Boris Karloff. Scales and anchors are in README.md ("The anchor rubric").
#
# PARTIAL: covers his sound-era features from The Criminal Code (1931) on. Deferred: the whole
# silent era (1919-1929) and his pre-Frankenstein talkie bit parts (The Unholy Night, The Bad
# One, The Sea Bat, The Utah Kid, Cracked Nuts, Young Donovan's Kid, The Public Defender, I Like
# Your Nerve, Graft, The Yellow Ticket, The Guilty Generation, Tonight or Never).
# Free wins (verified by matching tmdb_id): scarface-1932 (hawks.yaml), the-old-dark-house
# (james-whale.yaml), the-mask-of-fu-manchu (edward-van-sloan.yaml), the-raven-1935 +
# the-invisible-ray + son-of-frankenstein + black-friday-1940 + youll-find-out
# (bela-lugosi.yaml), house-of-frankenstein (john-carradine.yaml), the-body-snatcher
# (robert-wise.yaml), the-raven-1963 (aip.yaml), targets (laszlo-kovacs.yaml).
# Disambiguated behind-the-mask-1932, the-miracle-man-1932, the-walking-dead-1936,
# juggernaut-1936, tower-of-london-1939, the-ape-1940, the-secret-life-of-walter-mitty-1947,
# the-terror-1963. Excluded: serials (King of the Kongo, King of the Wild, The Vanishing
# Legion), uncredited or disputed parts (Smart Money, Mothers Cry, The Last Parade), cut scenes
# (Alias the Doctor), appearances as himself (The Cohens and Kellys in Hollywood, Gift of Gab),
# narration-only credits (The Emperor's Nightingale, The Juggler of Our Lady, The Creation of
# the World, Mondo Balordo), Colonel March Investigates (assembled from TV episodes), and
# films that only reuse old footage of him.

