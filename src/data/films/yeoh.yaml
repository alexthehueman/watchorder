# Films for Michelle Yeoh. Scales and anchors are in README.md ("The anchor rubric").
#
# Crouching Tiger, Hidden Dragon is shared with chow-yun-fat.yaml — both entities reference this
# single copy. She did her own stunts for the entire Hong Kong action run below, which is why the
# stillness values sit so low: these are propulsive films built around what her body could
# physically do, decades before Everything Everywhere All at Once made that legible to Hollywood.

