# Films for Bibi Andersson. Scales and anchors are in README.md ("The anchor rubric").
#
# The Seventh Seal and Wild Strawberries already exist in von-sydow.yaml.
# Persona already exists in ullmann.yaml. The Touch below is her own. This pass adds further free
# wins Smiles of a Summer Night and The Magician (both Gunnar Björnstrand), All These Women and
# The Passion of Anna (both Sven Nykvist), Scenes from a Marriage (Ullmann), Babette's Feast
# (Stéphane Audran), and Twice a Woman (Anthony Perkins), plus 7 new films below.
#
# Exposed needed a distinct id for her 1983 role, unrelated to Ana de Armas's unrelated 2016 film
# already in the corpus despite sharing the exact title.
#
# Scope note: her ~70-credit, Swedish-language-dominant career has an enormous tail of obscure
# 1950s-2000s Scandinavian films with no accessible Anglophone synopsis or reception info to tag
# content flags from with confidence. Added only the well-documented, internationally released
# English-language films; the rest deliberately deferred to a dedicated future pass.

