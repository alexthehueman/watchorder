# New films for Billy Bob Thornton. Scales and anchors are in README.md ("The anchor rubric").
#
# Armageddon already exists in buscemi.yaml — tagged before he had an entity.
# Monster's Ball already exists in berry.yaml. Love Actually already exists in thompson.yaml.
# Free wins (verified by matching tmdb_id): for-the-boys (bette-midler.yaml), indecent-proposal
# (demi-moore.yaml), dead-man (depp.yaml), one-false-move + the-dark-backward
# (bill-paxton.yaml), tombstone (val-kilmer.yaml), the-thin-red-line (malick.yaml), u-turn
# (robert-richardson.yaml), princess-mononoke (ghibli.yaml), the-man-who-wasnt-there
# (coens.yaml), daddy-and-them (ben-affleck.yaml), the-judge (downey.yaml), our-brand-is-crisis
# + eagle-eye (mackie.yaml), whiskey-tango-foxtrot (fey.yaml), the-gray-man (de-armas.yaml),
# intolerable-cruelty + levity (roger-deakins.yaml), the-ice-harvest (harold-ramis.yaml),
# school-for-scoundrels (stiller.yaml), mr-woodcock (poehler.yaml), puss-in-boots-2011
# (banderas.yaml). Excluded Crazy Mama-style uncredited bits, My Run (documentary,
# narration only), Ghosts of the Abyss-style appearances, and Standing on the Shoulders of
# Kitties (cameo as himself). All the Pretty Horses (2000) excluded — Thornton directed but
# did not act in it.

