# New films for Brad Pitt. Scales and anchors are in README.md ("The anchor rubric").
#
# Free wins (verified by matching tmdb_id): true-romance (oldman.yaml),
# interview-with-the-vampire (dunst.yaml), legends-of-the-fall (john-toll.yaml), the-devils-own
# (alan-j-pakula.yaml), meet-joe-black (hopkins.yaml), snatch (jason-statham.yaml),
# oceans-twelve (cassel.yaml), oceans-thirteen (pacino.yaml), the-assassination-of-jesse-james
# (roger-deakins.yaml), burn-after-reading (mcdormand.yaml),
# the-curious-case-of-benjamin-button (henson.yaml), megamind (stiller.yaml), 12-years-a-slave
# (fassbender.yaml), the-counselor (bardem.yaml), by-the-sea (jolie.yaml), the-big-short
# (bale.yaml), war-machine (anthony-michael-hall.yaml), ad-astra (hoyte-van-hoytema.yaml),
# plus thelma-and-louise (sarandon.yaml), mr-and-mrs-smith (jolie.yaml), babel
# (alejandro-inarritu.yaml) and babylon (damien-chazelle.yaml), matched on title and year
# because their tmdb_id was missing or wrong (now corrected from his TMDB credit list).
# Disambiguated happy-together-1989, fury-2014, the-lost-city-2022. Excluded: TV movies (A
# Stoning in Fulham County, The Image, Too Young to Die, Two-Fisted Tales), uncredited bits
# (Hunk, No Man's Land, Less Than Zero, Being John Malkovich, Abby Singer), appearances as
# himself (Full Frontal), sight-gag cameos (Confessions of a Dangerous Mind, Deadpool 2),
# narration-only credits, shorts and documentaries. Not yet released as of 2026-11-16: The
# Adventures of Cliff Booth, The Riders.
#
# The Tree of Life, Inglourious Basterds and Once Upon a Time in Hollywood already exist in
# malick.yaml and tarantino.yaml — three of his most significant roles, tagged before he had an
# entity. Se7en is shared with morgan-freeman.yaml, tagged here since he's the audience's point of
# entry into the case.

