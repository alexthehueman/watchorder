# The four below widen a corpus that was otherwise eight films from a single five-year window, all
# of them short comedies with near-identical profiles — the quiz had literally nothing to move
# (taste-only D measured 0.002). These are real directed features rather than padding, and they are
# where his actual variation lives: Go West is melancholy more than funny, Battling Butler ends in
# genuine brutality, The Saphead predates his control of his own material.
