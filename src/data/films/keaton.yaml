# Films for Buster Keaton. Scales and anchors are in README.md ("The anchor rubric").
#
# The counterweight to Chaplin in the corpus, and deliberately tagged as one: near-identical humor
# values, consistently lower bleakness. Keaton's films end with the problem solved and the man
# unbothered, where Chaplin's end on the cost of solving it. Same genre, opposite worldview, which
# is exactly the separation between humor and bleakness the rubric exists to enforce.
#
# Runtimes are short by modern standards and that is not an error — the feature length of 1924.

