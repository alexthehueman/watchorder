# Films for Andrei Tarkovsky. Scales and anchors are in README.md ("The anchor rubric").
#
# Added to close a gap the plan named explicitly: the spread grid is meant to span "slow cinema
# (Tarkovsky)" and he was never tagged. Note the stillness values sit at 4, not 5 — the rubric
# pins 5 to Jeanne Dielman and Sátántangó, where duration is itself the subject, and Stalker is
# the named anchor for 4. Tarkovsky is slow; those two are structurally about slowness.

