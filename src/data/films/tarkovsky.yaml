- id: andrei-rublev
  tmdb_id: null
  title: Andrei Rublev
  year: 1966
  runtime: 205
  director: Andrei Tarkovsky
  tags:
    opacity: 3
    stillness: 4
    bleakness: 3 # eight chapters of brutality, and then the bell is cast and the icons turn to colour
    humor: 2 # the jester who opens the film is genuinely funny, right up until he is punished for it
    acclaim: 0.93
  # A horse is killed on camera. Flagged rather than argued about: the rubric asks what a viewer
  # who set the toggle would want to know, not what the film's defenders think it means.
  content: { sexual_violence: false, animal_harm: true, child_harm: false, suicide: false, violence: 3, sex: 1 }

