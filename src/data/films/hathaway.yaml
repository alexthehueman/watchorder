# New films for Anne Hathaway. Scales and anchors are in README.md ("The anchor rubric").
#
# Les Misérables already exists in russell-crowe.yaml — tagged before she had an entity. The
# Devil Wears Prada already exists in streep.yaml — tagged before she had an entity. Interstellar
# already exists in mcconaughey.yaml — tagged before she had an entity. This pass adds further
# free wins Alice in Wonderland and Alice Through the Looking Glass (both Rickman), Get Smart
# (Arkin), Ocean's Eight (Bullock) and Dark Waters (Todd Haynes), plus 26 new films below.
#
# Excludes several still-unreleased or unverifiable future projects (Fear Not, an untitled FBI
# wedding-sting film, The Princess Diaries 3, Yesteryear, Seesaw Monster, Days of Thunder 2, Alone
# at Dawn, Verity, The End of Oak Street) and a TV special. The Odyssey, Mother Mary and The Devil
# Wears Prada 2 are all already released as of this pass.

