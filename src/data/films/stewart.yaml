# New films for James Stewart. Scales and anchors are in README.md ("The anchor rubric").
#
# Vertigo and Rear Window already exist in hitchcock.yaml, The Philadelphia Story in
# hepburn-katharine.yaml, and Liberty Valance in ford.yaml. Four of his defining performances were
# tagged for other entities before he had one.
#
# The bleakness spread is the point of this filmography and it is wider than his reputation allows.
# The everyman decency is real, and so is the Mann western run where he plays men consumed by
# revenge, and Vertigo, where the persona is used against the audience deliberately.

