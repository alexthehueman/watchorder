# New films for Anthony Mackie. Scales and anchors are in README.md ("The anchor rubric").
#
# The Avengers already exists in johansson.yaml — tagged before he had an entity. This pass adds
# further free wins Ghosted (Ana de Armas), The Woman in the Window (Amy Adams), Seberg (Kristen
# Stewart), Avengers: Endgame (Angela Bassett), Avengers: Infinity War (Brolin), Detroit (Boyega),
# Love the Coopers (Alan Arkin), Ant-Man (Rudd), Avengers: Age of Ultron (Olsen), Captain America:
# The Winter Soldier (Evans), The Fifth Estate (Cumberbatch), Gangster Squad (Ruben Fleischer),
# Half Nelson (Gosling), and Million Dollar Baby (Morgan Freeman), plus 45 new films below.
#
# Notorious needed a distinct id — his 2008 Biggie Smalls biopic, unrelated to Hitchcock's 1946
# film already in the corpus under another entity despite sharing the exact title. The Manchurian
# Candidate (his actual 2004 remake) turned out to already exist as a free win in
# jonathan-demme.yaml, verified via matching tmdb_id. Excluded as
# documentaries/specials/shorts about him rather than acting roles: Shark Beach with Anthony
# Mackie, Timeless Heroes, Disney100, Celebrating Betty White, the Marvel Disney+ Day Special,
# Creating a Character, Celebrating Marvel's Stan Lee, Marvel Studios: Expanding the Universe,
# Marvel Studios: Assembling a Universe, Goose (narrator), and Born to Fight (a Million Dollar
# Baby featurette, not the unrelated 2004 Thai action film of the same name). Excluded as
# unreleased as of today: Barracuda, Avengers: Doomsday, Avengers: Secret Wars.

