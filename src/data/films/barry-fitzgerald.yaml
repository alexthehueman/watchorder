# New films for Barry Fitzgerald. Scales and anchors are in README.md ("The anchor rubric").
#
# The Quiet Man, How Green Was My Valley, and The Long Voyage Home already exist in ford.yaml.
# This pass adds further free wins California and Variety Girl and The Plough and the Stars (all
# Stanwyck), Bringing Up Baby (Katharine Hepburn), and The Sea Wolf (Michael Curtiz), plus 34 new
# films below.
#
# Marie Antoinette needed a distinct id — his 1938 MGM epic, unrelated to Sofia Coppola's 2006
# film already in the corpus under Dunst despite sharing the exact title. Excluded as
# documentaries/TV episodes rather than feature films: Bing Crosby: Rediscovered, Santa Claus and
# the Tenth Avenue Kid (an Alfred Hitchcock Presents episode), and Cradle of Genius (a short
# documentary about the Abbey Theatre).

