# New films for Peter Sellers. Scales and anchors are in README.md ("The anchor rubric").
#
# Dr. Strangelove and Lolita already exist in kubrick.yaml — he plays three parts in the former and
# the film's cruellest comic role in the latter, both tagged before he had an entity.
#
# Being There is the whole argument for including him beyond the Pink Panther films: everything
# else here is broad, and his final performance is a masterclass in giving almost nothing at all.

