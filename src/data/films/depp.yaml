# Films for Johnny Depp. Scales and anchors are in README.md ("The anchor rubric").
#
# Eight Burton collaborations exist beyond the two here, but these two are the ones that made the
# partnership — everything after either repeats or escalates the same gentle-outsider register.
# Dead Man and Fear and Loathing sit at opposite ends of what "strange leading man" can mean: one
# almost silent and mystical, the other a non-stop hallucinatory monologue.
#
# The Ninth Gate is added because opacity and stillness both clustered — most of the mainstream
# work here is deliberately legible, which is accurate but left the axes with nothing to move.
# Polanski's occult mystery is patient, genuinely ambiguous about whether the supernatural is real,
# and never resolves it either way.

