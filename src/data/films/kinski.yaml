# New films for Klaus Kinski. Scales and anchors are in README.md ("The anchor rubric").
#
# Aguirre, Nosferatu the Vampyre, Woyzeck and Fitzcarraldo already exist in herzog.yaml — four of
# their five collaborations, tagged before he had an entity. Cobra Verde, their fifth and final film
# together, is new here.
#
# Doctor Zhivago and For a Few Dollars More exist specifically to show he had a whole career of
# mainstream work most people never connect to him — a brief, chilling cameo in a David Lean epic
# and a Sergio Leone villain, both years before Aguirre made him Herzog's muse.

