# matching tmdb_id): Emma. (2020, oconnor.yaml, id emma-2020), Blow Dry (alan-rickman.yaml),
# Underworld (beckinsale.yaml), Shaun of the Dead (edgar-wright.yaml), The Hitchhiker's Guide
# to the Galaxy (alan-rickman.yaml), The Constant Gardener (weisz.yaml), Notes on a Scandal
# (blanchett.yaml), Hot Fuzz (timothy-dalton.yaml), Valkyrie (bryan-singer.yaml), Rango
# (roger-deakins.yaml), Harry Potter and the Deathly Hallows: Part 1 (alan-rickman.yaml),
# Jack the Giant Slayer (bryan-singer.yaml), Pride (scott.yaml, id pride-2014), Their Finest
# (scott.yaml), Hope Gap (bening.yaml). Total Recall disambiguated to total-recall-2012 (the
# 1990 original is in schwarzenegger.yaml). Phantom of the Opera disambiguated to
# phantom-of-the-opera-1989 (Robert Englund version; the Lon Chaney/Rains versions are
# elsewhere). Joy disambiguated to joy-2024 (the 2015 Jennifer Lawrence film is elsewhere).
