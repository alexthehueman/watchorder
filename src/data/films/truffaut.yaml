# Films for François Truffaut. Scales and anchors are in README.md ("The anchor rubric").
#
# The useful contrast with Godard, who is already in the corpus: they started in the same magazine
# and the same year, and the tags separate them cleanly — Godard's opacity climbs toward 5 and
# stays there, Truffaut's sits at 1-2 for a whole career. The New Wave was not one thing, and a
# roster that tagged them alike would be saying it was.

