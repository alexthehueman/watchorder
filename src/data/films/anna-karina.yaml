# Films for Anna Karina. Scales and anchors are in README.md ("The anchor rubric").
#
# Pierrot le Fou, Band of Outsiders, A Woman Is a Woman, and Vivre sa Vie already exist in
# godard.yaml. This pass adds two further free wins, Alphaville (also godard.yaml) and Cléo from 5
# to 7 (varda.yaml), plus 6 new films below.
#
# Her real filmography runs to roughly 90 acting credits. The overwhelming majority are obscure
# 1960s-80s European films, TV movies and shorts with essentially no accessible English-language
# synopsis or reception information, plus a large, more recent tail of documentaries and tributes
# about Godard, Belmondo, Dreyer, the French New Wave, and her own life. Tagging the obscure tail's
# content-safety flags with real confidence isn't possible from a title and a TMDB id alone — this
# pass adds only the films with genuine documented significance (further Godard collaborations, and
# two well-known literary adaptations) and leaves the rest for a dedicated future pass rather than
# guessed.

