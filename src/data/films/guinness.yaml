# Films for Alec Guinness. Scales and anchors are in README.md ("The anchor rubric").
#
# He plays eight different members of the same family in Kind Hearts and Coronets, which the
# register field cannot represent as a single value — tagged here as the film's dominant tone
# (comic) rather than trying to average eight performances into one number.
#
# Star Wars is deliberately absent. He gave one of the most consequential supporting performances
# in film history in it and resented the association for the rest of his career; the roster
# includes it for exactly that tension rather than leaving it out to make a cleaner arthouse case.

