# New films for Monica Vitti. Scales and anchors are in README.md ("The anchor rubric").
#
# L'Avventura, La Notte, L'Eclisse and Red Desert already exist in antonioni.yaml — the four films
# that made her internationally famous, all tagged before she had an entity of her own. Only the
# films below are new.
#
# Worth stating directly: everyone who knows her only from Antonioni knows a quarter of the career.
# She spent the seventies as Italy's biggest comic star, and Modesty Blaise is a spy spoof played
# entirely straight-faced. The humor spread here is close to the widest on the roster.

