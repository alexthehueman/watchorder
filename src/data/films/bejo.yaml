# New films for Bérénice Bejo. Scales and anchors are in README.md ("The anchor rubric").
#
# The Artist already exists in goodman.yaml — tagged before she had an entity. This pass adds a
# further free win A Knight's Tale (Paul Bettany), plus 17 new films below.
#
# Scope note: her ~56-credit French-language career has an enormous tail of shorts, documentaries
# (Henri-Georges Clouzot's Inferno, Letters to Jackie, Seduced and Abandoned, Nothing to Hide, For
# the Love of Sharks), award-ceremony/making-of specials, and small-scale French TV movies and
# festival-only films with no accessible Anglophone synopsis or reception info to tag content
# flags from with confidence. Added only the well-documented, internationally released features;
# the rest deliberately deferred to a dedicated future pass.

