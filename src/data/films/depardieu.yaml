# New films for Gérard Depardieu. Scales and anchors are in README.md ("The anchor rubric").
#
# The Last Metro already exists in truffaut.yaml — tagged before he had an entity.
#
# Danton and The Return of Martin Guerre both use him as a commanding, unreadable presence in ways
# the comedies never do — worth keeping next to Green Card and Get Out Your Handkerchiefs so the
# range is visible rather than assumed.
#
# Added because opacity and stillness both sat low across six of seven films — accurate to how
# legible most of his best-known work is, but too uniform for either axis to move anything. Under the
# Sun of Satan is the honest outlier: Pialat's elliptical, unresolved style is nothing like Rappeneau
# or Berri's, and it's a real, well-known Depardieu performance rather than an invented data point.

