# New films for Catherine Deneuve. Scales and anchors are in README.md ("The anchor rubric").
#
# Belle de Jour and Tristana already exist in bunuel.yaml, The Last Metro in truffaut.yaml, and
# 8 Women in ozon-adjacent tagging — four of her defining roles were tagged before she had an
# entity, which is what happens to anyone who worked with every major European director for fifty
# years.
#
# The useful thing about this filmography is that the composure is a fixed quantity and the films
# around it are not: Demy uses it for warmth, Polanski for horror, Buñuel for irony. The bleakness
# range runs 2 to 5 while her register barely moves, which is the whole argument for her.

- id: the-umbrellas-of-cherbourg
  tmdb_id: null
  title: The Umbrellas of Cherbourg
  year: 1964
  runtime: 91
  director: Jacques Demy
  tags:
    opacity: 1
    stillness: 2
    bleakness: 4 # entirely sung, in candy colours, and it ends with both of them settling
    humor: 2
    acclaim: 0.90
  content: { sexual_violence: false, animal_harm: false, child_harm: false, suicide: false, violence: 0, sex: 1 }

