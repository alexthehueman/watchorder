# New films for Albert Finney. Scales and anchors are in README.md ("The anchor rubric").
#
# Tom Jones already exists in tony-richardson.yaml. Erin Brockovich already exists in julia-roberts.yaml.
# Murder on the Orient Express already exists in bergman-ingrid.yaml. This pass adds free wins
# Skyfall (fiennes.yaml), The Bourne Legacy and Jason Bourne (weisz.yaml, cassel.yaml), Ocean's
# Twelve (cassel.yaml), Traffic (del-toro.yaml), Miller's Crossing (coens.yaml) and Two for the
# Road (hepburn-audrey.yaml), plus 36 new films below.
#
# Excludes documentaries and making-of pieces about him or his films (Uncovering Wolfen, Vito,
# Audrey Hepburn: Remembered, Notes from Under the Volcano, Observations Under the Volcano, Lights!
# Camera! Annie!). Includes a small number of unusual but genuine credits: Roger Waters: The Wall —
# Live in Berlin (a real filmed concert performance, not a documentary about him) and several
# 1980s-90s TV movies.

