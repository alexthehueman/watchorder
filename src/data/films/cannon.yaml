# The acclaim numbers here are genuinely low and should stay that way. Cannon is in the roster
# because its story is extraordinary, not because the films are good, and a corpus that quietly
# inflated them to justify the inclusion would be lying about the one thing acclaim measures.
# Runaway Train is the exception and the exception is the point.

