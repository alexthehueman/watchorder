# Filename disambiguates on purpose: Nicholas Ray and Man Ray are both plausible future entities and
# ray.yaml would become a trap the moment either arrives.
#
# The Apu trilogy is three separate entries rather than one, unlike the way Twin Peaks is handled
# for Lynch, because these were released years apart as standalone features and each was reviewed,
# awarded and watched on its own. The prereq relationship carries the ordering instead.

