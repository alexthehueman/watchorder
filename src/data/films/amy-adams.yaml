# New films for Amy Adams. Scales and anchors are in README.md ("The anchor rubric").
#
# The Master already exists in pta.yaml — tagged before she had an entity. Doubt already exists
# in streep.yaml — tagged before she had an entity. American Hustle, The Fighter, and Vice
# already exist in bale.yaml (all three genuine dual leads with him) — tagged before she had an
# entity. This pass adds further free wins Justice League (Jason Momoa), Man of Steel (Shannon),
# Charlie Wilson's War (Philip Seymour Hoffman), Catch Me If You Can (Spielberg), Her (Phoenix),
# Big Eyes (Waltz) and Sunshine Cleaning (Alan Arkin), plus 30 new films below.
#
# Excludes documentaries, making-of featurettes, and several shorts from her TMDB page. Klara and
# the Sun, Star Wars: Starfighter and Lazy Susans are all still unreleased as of this pass (Klara
# has a confirmed October 2026 date but hasn't opened yet); At the Sea premiered at Berlin in
# February 2026 and is included.

