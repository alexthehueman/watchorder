# New films for Alberto Sordi. Scales and anchors are in README.md ("The anchor rubric").
#
# I Vitelloni already exists in fellini.yaml. La Grande Guerra already exists
# in vittorio-gassman.yaml. A Farewell to Arms already exists in charles-lang.yaml.
#
# Sordi's real filmography runs to roughly 170 acting credits, most of them 1950s-60s Italian
# comedies with almost no English-language footprint or accessible synopsis information — tagging
# them all with real confidence (especially the content-safety flags, which this corpus treats as
# trustworthy) isn't something to do from a title and a TMDB id alone. This pass adds the handful
# that are genuinely well-documented and significant: his Fellini-adjacent work, his two Golden
# Globe/Golden Bear titles, and a couple of the most-written-about entries from his prime. The
# other ~150 are deliberately left for a dedicated pass rather than guessed into the corpus.

