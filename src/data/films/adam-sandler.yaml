# New films for Adam Sandler. Scales and anchors are in README.md ("The anchor rubric").
#
# Uncut Gems already exists in a24.yaml — tagged before he had an entity. Punch-Drunk Love
# already exists in pta.yaml. Airheads, Mixed Nuts, The Longest Yard, Grown Ups and Top Five also
# already existed. The films below fill out the rest of his real acting filmography per Wikipedia.
#
# Excludes producer-only credits with no acting role (Paul Blart, Grandma's Boy, The Benchwarmers,
# Strange Wilderness, The House Bunny, Dickie Roberts, Bucky Larson, Here Comes the Boom, Joe Dirt,
# Joe Dirt 2, The Wrong Missy), documentaries and specials he appears in as himself rather than
# acting (Stupidity, I Am Chris Farley, Norm Macdonald: Nothing Special), and shorts (A Day with
# the Meatball, Couch, Goldman v Silverman, Nature Planet, Puppy!) — all consistent with the
# corpus's runtime-driven design elsewhere (see Maya Deren's deferred note in the working list).

