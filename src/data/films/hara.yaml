# Register and confusion are likely to read narrow for her, honestly. Ozu's whole aesthetic is
# static, patient and largely unambiguous, and five of these eight films are his — that is a fact
# about the collaboration, not a tagging shortfall. See Miyazaki and Béla Tarr for the same
# reasoning applied to a director's corpus.

