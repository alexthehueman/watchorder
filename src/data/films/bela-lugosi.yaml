# New films for Bela Lugosi. Scales and anchors are in README.md ("The anchor rubric").
#
# The Black Cat already exists in boris-karloff.yaml — tagged before he had an entity. This pass
# adds further free wins Ninotchka (MGM), Fantasia (Disney), The Wolf Man (Lon Chaney Jr.), Ghosts
# on the Loose (Ava Gardner), The Body Snatcher (Robert Wise), and Mark of the Vampire (Tod
# Browning — this one also fixed a real pre-existing bug: tod-browning.yaml's tmdb_id pointed at
# an unrelated 2009 Miley Cyrus documentary), and The Death Kiss (David Manners), plus 51 new
# films below.
#
# The Black Cat (1941) needed a distinct id for the Basil Rathbone-led reboot, unrelated to the
# 1934 Karloff/Lugosi original already in the corpus despite sharing the exact title.
#
# Scope note: his 1917-1929 Hungarian and German silent-era career (a dozen-plus films) has no
# accessible synopsis or reception info to tag content flags from with confidence — deliberately
# deferred to a dedicated future pass. Excluded Lock Up Your Daughters (1959, posthumous archival
# footage in an unrelated later film) as not a real performance.

