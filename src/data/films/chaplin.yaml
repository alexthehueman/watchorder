# Films for Charlie Chaplin. Scales and anchors are in README.md ("The anchor rubric").
#
# The rubric's humor 5 is "comedy is the point", and most of this filmography sits there honestly.
# What keeps the axis from going flat is that he kept ending comedies in places comedy does not go:
# City Lights on a look, Modern Times on a road, Verdoux on a guillotine. So humor runs 3-5 and
# bleakness carries the actual variation, which is the correct division of labour between them.

