# Films for Bette Davis. Scales and anchors are in README.md ("The anchor rubric").
#
# Almost nothing here is opaque and almost nothing is slow — this is studio-era Warner Brothers,
# built to be legible. The axis carrying the whole filmography is bleakness, because she spent a
# career choosing parts where the woman does not get away with it, at a time when that was a
# commercial risk rather than a prestige move.
#
# Free wins: So Big! (Stanwyck — both actresses in the same 1932 film), The Catered Affair (Barry
# Fitzgerald), The Scapegoat (Guinness), Death on the Nile 1978 (Jack Cardiff), Hush...Hush, Sweet
# Charlotte (Joseph Biroc), and Waterloo Bridge 1931 (Mae Clarke) were already in the corpus under
# other entities, plus 54 new films below.
#
# Bordertown needed a distinct id for her 1935 film, unrelated to Antonio Banderas's unrelated 2007
# film already in the corpus despite sharing the exact title. Death on the Nile also needed a
# distinct id — her 1978 role, unrelated to the 2022 Kenneth Branagh remake already in the corpus
# under Bening.

