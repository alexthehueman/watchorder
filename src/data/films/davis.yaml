# Films for Bette Davis. Scales and anchors are in README.md ("The anchor rubric").
#
# Almost nothing here is opaque and almost nothing is slow — this is studio-era Warner Brothers,
# built to be legible. The axis carrying the whole filmography is bleakness, because she spent a
# career choosing parts where the woman does not get away with it, at a time when that was a
# commercial risk rather than a prestige move.

