# Films for Sergei Eisenstein. Scales and anchors are in README.md ("The anchor rubric").
#
# The theorist of montage editing, across two very different Soviet eras — the raw agitprop of the
# silent 1920s and the stylized, theatrical historical epics of the Stalin years, made under direct
# political pressure that shows in how differently Ivan the Terrible reads today than it did then.

