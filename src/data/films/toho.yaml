# New films for Toho. Scales and anchors are in README.md ("The anchor rubric").
#
# Most of this entity's roster already exists in src/data/films/mifune.yaml — the Kurosawa films he
# starred in were Toho productions, and this is the free-overlap pattern the actor batch already
# established (Day-Lewis, Swinton, Binoche reusing shared director filmographies). Only the titles
# below are genuinely new: the kaiju side of the studio, and a Kurosawa prestige drama that has no
# Mifune in it at all. Rashomon is deliberately NOT reused here — it was a Daiei production, not
# Toho's, despite starring Mifune and being directed by Kurosawa.

