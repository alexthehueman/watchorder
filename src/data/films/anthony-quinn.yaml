# New films for Anthony Quinn. Scales and anchors are in README.md ("The anchor rubric").
#
# La Strada already exists in fellini.yaml. Lawrence of Arabia already exists in otoole.yaml.
# Viva Zapata! already exists in brando.yaml. This pass adds further free wins The Guns of
# Navarone (Gregory Peck), The Ox-Bow Incident (Henry Fonda), Jungle Fever (Spike Lee), Lost
# Command (Delon), The Secret of Santa Vittoria and Wild Is the Wind (both Magnani), plus 20 new
# films below.
#
# The Hunchback of Notre Dame needed a distinct id — his 1956 French version with Gina
# Lollobrigida, unrelated to Charles Laughton's 1939 classic already in the corpus under another
# actor despite sharing the exact title.
#
# Scope note: his 66-year, 118-plus-credit career is dominated by an enormous tail of obscure
# 1930s-40s B-picture bit parts and scattered 1970s-90s international films (Spanish, Italian,
# and otherwise) with no accessible synopsis or reception info to tag content flags from with
# confidence. Added only the well-documented major films; the rest deliberately deferred to a
# dedicated future pass rather than guessed.

