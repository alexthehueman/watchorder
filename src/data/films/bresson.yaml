# data.test.js correctly rejected a flat humor: 1 across the whole filmography. The honest fix was
# not to reinterpret the severe films but to include the two that genuinely are not: Les Dames
# carries Cocteau's dialogue and is arch in a way he never allowed himself again, and Four Nights
# is a romance that mostly forgives everyone in it.
- id: les-dames-du-bois-de-boulogne
  tmdb_id: null
  title: Les Dames du Bois de Boulogne
  year: 1945
  runtime: 86
  director: Robert Bresson
  tags:
    opacity: 2
    stillness: 3
    bleakness: 4
