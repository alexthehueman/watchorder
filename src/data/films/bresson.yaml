# Films for Robert Bresson. Scales and anchors are in README.md ("The anchor rubric").
#
# The narrowest filmography on the roster and honestly so: he made the same film thirteen times with
# increasing severity. Where the variation genuinely lives is bleakness — A Man Escaped ends with a
# man free and L'Argent ends with an axe, and pretending the axes move more than that would be
# describing a different director.

