# Films for Chris Marker. Scales and anchors are in README.md ("The anchor rubric").
#
# A small roster by design — most of a hundred-plus-title career is shorts, collaborations and
# footage essays that resist being tagged as discrete "films" at all. These four are the ones that
# stand alone: a science-fiction story told in stills, a globe-spanning essay, a three-hour history
# of the postwar left, and a video-game framing device for the Battle of Okinawa.

