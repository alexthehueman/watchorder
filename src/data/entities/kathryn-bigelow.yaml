    signature: 5
    must_see: true
    gateway: 3
    note: A CIA analyst spends a decade tracking one lead through interrogation rooms and dead ends, certain it will eventually lead to Bin Laden.

  - film: point-break
    signature: 4
    gateway: 5
    note: An FBI agent goes undercover with a crew of surfers he suspects of bank robbery, and starts to mean it a lot more than an undercover agent is supposed to.

  - film: near-dark
    signature: 3
    gateway: 3
    note: A small-town Oklahoma kid gets bitten by a drifter and pulled into her family of nomadic vampires, none of whom particularly want him kept alive.

  - film: strange-days
    signature: 3
    gateway: 2
