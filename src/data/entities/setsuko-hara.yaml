# Register and confusion are likely to read narrow for her, honestly. Ozu's whole aesthetic is
# static, patient and largely unambiguous, and five of these eight films are his — a fact about
# the collaboration, not a tagging shortfall. See Miyazaki and Béla Tarr for the same reasoning.

slug: setsuko-hara
kind: actor
name: Setsuko Hara
blurb: The Eternal Virgin of Japanese cinema, and Ozu's definitive collaborator.

films:
  - film: tokyo-story
    signature: 5
    must_see: true
    showcase: 5
    role_size: lead
    register: restrained
    gateway: 3
    note: A daughter-in-law's quiet kindness to the parents her own siblings have no time for.

  - film: no-regrets-for-our-youth
    signature: 3
    showcase: 4
    role_size: lead
    register: menacing
    gateway: 3
    note: Kurosawa, not Ozu — a student radical in wartime Japan, and a far more active register than anything else here.

  - film: late-spring
    signature: 5
    must_see: true
    showcase: 5
    role_size: lead
    register: warm
    gateway: 4
    note: A daughter reluctant to leave her widowed father. The first of the collaboration's peaks.

  - film: tokyo-twilight
    signature: 4
    showcase: 4
    role_size: lead
    register: restrained
    gateway: 1
    note: Ozu's bleakest film, and she carries it without a single raised voice.

  - film: early-summer
    signature: 4
    showcase: 4
    role_size: lead
    register: warm
    gateway: 4
    note: A family gently pressuring a daughter toward marriage. Warmer than it sounds.

  - film: late-autumn
    signature: 3
    showcase: 3
    role_size: lead
    register: comic
    gateway: 4
    note: A widowed mother's friends conspire to marry off her daughter. His lightest register.

  - film: the-end-of-summer
    signature: 3
    showcase: 3
    role_size: supporting
    register: restrained
    gateway: 3
    note: A family sake business, and an ageing patriarch nobody can quite control.

  - film: repast
    signature: 3
    showcase: 3
    role_size: lead
    register: restrained
    gateway: 3
    note: A tired marriage, directed by Naruse rather than Ozu — a different, harder-edged register.

  - film: sound-of-the-mountain
    signature: 3
    showcase: 4
    role_size: lead
    register: restrained
    gateway: 2
    note: A daughter-in-law closer to her father-in-law than to her own husband. Naruse again.

curated:
  curator: house
  rationale: The two Ozu films everyone means, then the range across two directors.
  order:
    - late-spring
    - early-summer
    - late-autumn
    - repast
    - the-end-of-summer
    - sound-of-the-mountain
    - tokyo-story
    - tokyo-twilight
