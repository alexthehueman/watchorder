slug: anthony-dod-mantle
kind: cinematographer
name: Anthony Dod Mantle
blurb: A pioneer of digital cinematography who shot the first Oscar-winning digitally captured film, moving fluidly between Dogme 95's handheld austerity, Danny Boyle's kinetic energy, and Lars von Trier's most punishing formal experiments.

films:
  - film: the-celebration
    signature: 5
    must_see: true
    gateway: 2
    note: A family dinner is derailed by a public accusation, shot handheld on early consumer digital cameras under the Dogme 95 manifesto's strict no-artifice rules.

  - film: slumdog-millionaire
    signature: 5
    must_see: true
    gateway: 1
    note: A Mumbai slum orphan's game-show winning streak is shot in restless, saturated digital color — his Oscar-winning breakthrough, and the first digitally-shot film to win one.

  - film: 28-days-later
    signature: 4
    gateway: 2
    note: A rage-virus outbreak empties London, shot on gritty early-2000s digital video that gives the abandoned city a queasy, documentary-real texture.

  - film: dogville
    signature: 4
    gateway: 2
    note: A small American town's cruelty escalates on a bare soundstage marked out in chalk, the camera's constant restless movement the only thing that isn't stripped away.

  - film: antichrist
    signature: 4
    gateway: 3
    note: A grieving couple's retreat into the woods is shot through dream logic and unexplained symbolism, beauty and horror photographed with the same unhurried patience.

  - film: 127-hours
    signature: 3
    gateway: 1
    note: A canyoneer trapped by a boulder for five days is shot with restless, fragmented visual invention that keeps a single-location survival story kinetic.

  - film: the-last-king-of-scotland
    signature: 3
    gateway: 2
    note: A young Scottish doctor is drawn into Idi Amin's inner circle, shot with handheld immediacy that makes Uganda's growing menace feel unstaged.

  - film: t2-trainspotting
    signature: 2
    gateway: 1
    note: A twenty-years-later reunion of old friends is shot with the same restless energy as the original, aged into something more melancholy.

curated:
  curator: house
  rationale: The two landmark achievements first, then the range across his Boyle and von Trier collaborations.
