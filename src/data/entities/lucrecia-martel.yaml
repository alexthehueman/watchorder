slug: lucrecia-martel
kind: director
name: Lucrecia Martel
blurb: Provincial Argentine bourgeoisie decaying in real time, filmed with a sound design so dense and a point of view so locked-in that you're never quite sure what you actually just saw.

films:
  - film: la-cienaga
    signature: 4
    must_see: true
    gateway: 2
    note: An extended family sweats through a decaying summer at a rural estate, drinking and bickering toward an accident the film has been quietly warning you about the whole time.

  - film: the-holy-girl
    signature: 4
    gateway: 2
    note: A teenage girl becomes convinced she's been chosen by God after a doctor gropes her in a crowd, and treats his eventual redemption as her religious calling.

  - film: the-headless-woman
    signature: 5
    must_see: true
    gateway: 1
    note: A woman may have hit something with her car on a country road, and the film stays locked to her dissociated point of view for the rest of its runtime, never confirming what.

  - film: zama
    signature: 4
    gateway: 2
    note: A colonial magistrate waits years for a transfer that never comes, stranded in a bureaucratic purgatory at the edge of the Spanish empire.

curated:
  curator: house
  rationale: The two best-known films first, then the range around them.
  order:
    - the-headless-woman
    - la-cienaga
    - zama
    - the-holy-girl
