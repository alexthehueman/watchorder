slug: james-stewart
kind: actor
name: James Stewart
blurb: The most trusted face in American film, which is exactly why Hitchcock and Anthony Mann kept using it to frighten people.

# The clearest signature/showcase split on the roster after Mastroianni. Mr. Smith is maximum
# persona and minimum range; Vertigo is barely the persona at all and is the best work he did.

films:
  - film: vertigo
    signature: 3
    showcase: 5
    must_see: true
    role_size: lead
    register: unhinged
    gateway: 4
    note: Obsession filmed as romance. The decency is still there, and it has become something frightening.

  - film: its-a-wonderful-life
    signature: 5
    showcase: 4
    must_see: true
    role_size: lead
    register: warm
    gateway: 5
    note: Remembered as the Christmas film. Most of it is a man realising he never escaped his home town.

  - film: rear-window
    signature: 4
    showcase: 3
    role_size: lead
    register: restrained
    gateway: 5
    note: Immobilised in a chair for the entire film, and it is still all performance.

  - film: mr-smith-goes-to-washington
    signature: 5
    showcase: 3
    role_size: lead
    register: warm
    gateway: 5
    note: The filibuster. Pure Capra idealism, and he plays it without a trace of irony.

  - film: the-naked-spur
    signature: 2
    showcase: 5
    role_size: lead
    register: unhinged
    gateway: 3
    note: A bounty hunter who has stopped pretending he is anything else. The Mann westerns are where the persona cracks.

  - film: anatomy-of-a-murder
    signature: 3
    showcase: 4
    role_size: lead
    register: restrained
    gateway: 4
    note: A small-town lawyer who may be defending a guilty man. Three hours, and the film never tells you.

  - film: the-shop-around-the-corner
    signature: 4
    showcase: 3
    role_size: lead
    register: warm
    gateway: 5
    note: Lubitsch, and the gentlest thing either of them made. Feuding colleagues, anonymous pen pals.

  - film: winchester-73
    signature: 3
    showcase: 4
    role_size: lead
    register: unhinged
    gateway: 4
    note: The first Mann collaboration, and the first time audiences saw him play hatred.

  - film: rope
    signature: 2
    showcase: 3
    role_size: supporting
    register: menacing
    gateway: 2
    note: The teacher whose ideas his students took seriously. He arrives late and dismantles the film.

  - film: harvey
    signature: 4
    showcase: 3
    role_size: lead
    register: warm
    gateway: 5
    note: A gentle drunk and his invisible rabbit. He played it on stage for years and never condescends to it.

  - film: the-philadelphia-story
    signature: 3
    showcase: 4
    role_size: supporting
    register: comic
    gateway: 5
    note: The tabloid reporter, drunk and in love. Won him the Oscar he thought belonged to someone else.

  - film: the-man-who-shot-liberty-valance
    signature: 3
    showcase: 3
    role_size: lead
    register: restrained
    gateway: 4
    note: Late Ford, and a man accepting that his whole career rests on someone else's act.

  - film: the-man-who-knew-too-much
    signature: 3
    showcase: 2
    role_size: lead
    register: restrained
    gateway: 4
    note: A father whose son is taken abroad. Competent Hitchcock, and the least interesting of their four.

curated:
  curator: house
  rationale: The trusted face first, then the four or five films that spend themselves dismantling it.
  order:
    - its-a-wonderful-life
    - mr-smith-goes-to-washington
    - rear-window
    - the-philadelphia-story
    - winchester-73
    - the-naked-spur
    - anatomy-of-a-murder
    - vertigo
