# Notorious, To Catch a Thief and North by Northwest already existed, tagged for Alfred Hitchcock;
# Bringing Up Baby and The Philadelphia Story for Katharine Hepburn — the same free-overlap
# pattern the rest of this batch established. Four films are new; see the note in
# src/data/films/grant.yaml.

slug: cary-grant
kind: actor
name: Cary Grant
blurb: The most purely charming man in classic Hollywood, occasionally cast against that on purpose.

films:
  - film: north-by-northwest
    signature: 4
    must_see: true
    showcase: 5
    role_size: lead
    register: comic
    gateway: 5
    note: An advertising man mistaken for a spy who does not exist, and he never once stops being charming about it.

  - film: his-girl-friday
    signature: 4
    must_see: true
    showcase: 5
    role_size: lead
    register: comic
    gateway: 5
    note: Fast-talking, fast-walking, and impossible to out-argue — this is the performance "Cary Grant" describes.

  - film: bringing-up-baby
    signature: 4
    showcase: 4
    role_size: lead
    register: comic
    gateway: 4
    note: A paleontologist chasing his own dinosaur bone, a leopard, and Katharine Hepburn, in roughly that order of difficulty.

  - film: notorious
    signature: 4
    showcase: 4
    role_size: lead
    register: restrained
    gateway: 3
    note: A spy handler willing to send the woman he loves into a Nazi's bed, and the film does not let him off easy for it.

  - film: the-philadelphia-story
    signature: 4
    showcase: 3
    role_size: lead
    register: comic
    gateway: 4
    note: An ex-husband circling his own remarriage, playing it cooler than he clearly feels.

  - film: to-catch-a-thief
    signature: 3
    showcase: 3
    role_size: lead
    register: comic
    gateway: 4
    note: A retired jewel thief courting suspicion and a rich widow's daughter, in roughly equal measure.

  - film: suspicion
    signature: 4
    showcase: 4
    role_size: lead
    register: menacing
    against_type: true
    gateway: 2
    note: A wife starts to believe her husband is planning to kill her, and the film never fully tells you if she's wrong.

  - film: charade
    signature: 3
    showcase: 3
    role_size: lead
    register: comic
    gateway: 4
    note: A widow doesn't know which of the men around her to trust, including the one played by Grant himself.

  - film: an-affair-to-remember
    signature: 3
    showcase: 3
    role_size: lead
    register: warm
    gateway: 3
    note: A shipboard romance and a missed rendezvous that becomes the whole rest of the film.

curated:
  curator: house
  rationale: The two roles the reputation is built on, then the range and one deliberate exception to it.
  order:
    - north-by-northwest
    - his-girl-friday
    - bringing-up-baby
    - notorious
    - the-philadelphia-story
    - suspicion
    - charade
