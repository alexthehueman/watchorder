slug: sam-raimi
kind: director
name: Sam Raimi
blurb: A camera that never stops moving, splatstick horror turned pure joy, and a career-long insistence that a superhero movie can still be genuinely weird.

films:
  - film: spider-man-2
    signature: 5
    must_see: true
    gateway: 4
    note: Peter Parker's double life finally collapses under its own weight, right as a scientist fuses himself to four sentient robotic arms.

  - film: evil-dead-ii
    signature: 5
    must_see: true
    gateway: 5
    note: A cabin's sole survivor battles his own possessed hand and an army of demons, in a film that's basically a live-action cartoon by the end.

  - film: spider-man
    signature: 4
    gateway: 5
    note: A science-nerd teenager gets bitten by a genetically modified spider and has to figure out what that actually means before his city does.

  - film: the-evil-dead
    signature: 4
    gateway: 3
    note: Five friends read the wrong passage from the wrong book in the wrong cabin, and only one of them is walking out.

  - film: a-simple-plan
    signature: 4
    gateway: 2
    note: Two brothers find millions in a crashed plane and agree to keep it quiet, which is the last decision in the film anyone actually keeps.

  - film: drag-me-to-hell
    signature: 3
    gateway: 4
