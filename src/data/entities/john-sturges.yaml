    signature: 5
    must_see: true
    gateway: 4
    note: A poor Mexican village hires seven gunfighters to defend them from a bandit gang that returns every year to strip the harvest, and the seven have to weld the villagers into a fighting force before the bandits come back.

  - film: the-great-escape
    signature: 5
    must_see: true
