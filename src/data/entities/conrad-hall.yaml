  - film: american-beauty
    signature: 5
    must_see: true
    gateway: 4
    note: Suburban interiors shot with almost geometric symmetry, rose petals lit like a hallucination — his third Oscar, and the one that reads as a horror film's lighting applied to a cul-de-sac.

  - film: road-to-perdition
    signature: 4
    gateway: 3
    note: A gangster film shot mostly through rain-streaked glass and doorways, actors reduced to silhouette at the exact moments the plot turns violent — his final film, awarded the Oscar after his death.

