slug: conrad-hall
kind: cinematographer
name: Conrad Hall
blurb: Silhouettes, hard top-lighting, and faces he was willing to let go dark rather than flatter — three Oscars across four decades, from New Hollywood grit to suburban gothic.

films:
  - film: cool-hand-luke
    signature: 3
    gateway: 3
    note: Chain-gang sunlight so harsh it becomes punishing in its own right — heat as an antagonist the film never has to name.

  - film: in-cold-blood
    signature: 4
    must_see: true
    gateway: 2
    note: A killer's face reflected in a rain-streaked window during his own execution, superimposed and doubled — stark black-and-white used to make an already unbearable scene worse.

  - film: butch-cassidy-and-the-sundance-kid
    signature: 3
    gateway: 4
    note: A sepia-toned freeze frame that turns the ending into a photograph before the bullets in it can actually land.

  - film: american-beauty
    signature: 5
    must_see: true
    gateway: 4
    note: Suburban interiors shot with almost geometric symmetry, rose petals lit like a hallucination — his third Oscar, and the one that reads as a horror film's lighting applied to a cul-de-sac.

  - film: road-to-perdition
    signature: 4
    gateway: 3
    note: A gangster film shot mostly through rain-streaked glass and doorways, actors reduced to silhouette at the exact moments the plot turns violent — his final film, awarded the Oscar after his death.

curated:
  curator: house
  rationale: The two Oscar-winning images that bookend his career, then the range between them.
  order:
    - american-beauty
    - road-to-perdition
    - in-cold-blood
    - butch-cassidy-and-the-sundance-kid
    - cool-hand-luke
