slug: conrad-hall
kind: cinematographer
name: Conrad Hall
blurb: Silhouettes, hard top-lighting, and faces he was willing to let go dark rather than flatter — three Oscars across four decades, from New Hollywood grit to suburban gothic.

films:
  - film: harper
    signature: 2
    gateway: 4
    note: Bright, breezy 1960s Los Angeles neo-noir in sun-bleached color.

  - film: the-professionals
    signature: 3
    gateway: 4
    note: Wide, dust-baked Mexican-desert Panavision — one of the great sun-scorched Westerns.

  - film: cool-hand-luke
    signature: 3
    gateway: 3
    note: Chain-gang sunlight so harsh it becomes punishing in its own right — heat as an antagonist the film never has to name.

  - film: in-cold-blood
    signature: 4
    must_see: true
    gateway: 2
    note: A killer's face reflected in a rain-streaked window during his own execution, superimposed and doubled — stark black-and-white used to make an already unbearable scene worse.

  - film: hell-in-the-pacific
    signature: 2
    gateway: 3
    note: Two men on a tiny island in jungle greens and hard Pacific sun.

  - film: butch-cassidy-and-the-sundance-kid
    signature: 3
    gateway: 4
    note: A sepia-toned freeze frame that turns the ending into a photograph before the bullets in it can actually land.

  - film: tell-them-willie-boy-is-here
    signature: 3
    gateway: 2
    note: Mojave heat haze and empty desert horizons for a pursuit that unfolds mostly in silence.

  - film: fat-city
    signature: 3
    gateway: 2
    note: Stockton's dingy bars and gyms in tobacco-brown light — a boxing film of sweaty, dim rooms.

  - film: electra-glide-in-blue
    signature: 3
    gateway: 3
    note: Monument Valley highways shot with wide-open freedom and lonely late-afternoon light.

  - film: the-day-of-the-locust
    signature: 3
    gateway: 2
    note: 1930s Hollywood dust and studio-lot golds, ending in a riot lit as hellfire.

  - film: marathon-man
    signature: 2
    gateway: 4
    note: Manhattan streets and a chilly, hard-lit dentist's chair — the light of the famous torture scene as its own kind of dread.

  - film: black-widow-1987
    signature: 2
    gateway: 3
    note: A glossy Pacific-coast and Hawaii thriller sheen.

  - film: tequila-sunrise
    signature: 2
    gateway: 3
    note: Golden-hour Southern California harbour light on a triangle of love and betrayal.

  - film: class-action
