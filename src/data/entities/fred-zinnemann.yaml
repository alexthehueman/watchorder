slug: fred-zinnemann
kind: director
name: Fred Zinnemann
blurb: A quiet, precise classicist who returned again and again to people holding a moral line alone under enormous pressure to give it up.

films:
  - film: from-here-to-eternity
    signature: 5
    must_see: true
    gateway: 4
    note: A soldier stationed in Hawaii refuses his commanding officer's order to box for the regiment, and the retaliation for his refusal spreads through the base right as tensions with Japan are about to erupt.

  - film: high-noon
    signature: 5
    must_see: true
    gateway: 4
    note: A retiring marshal learns a man he sent to prison is arriving on the noon train for revenge, and spends the morning begging the townspeople who owe him for their safety to stand with him.

