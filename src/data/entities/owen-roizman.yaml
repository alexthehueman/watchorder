slug: owen-roizman
kind: cinematographer
name: Owen Roizman
blurb: A five-time Oscar nominee never once a winner, whose gritty 1970s New York location work on Friedkin's early films helped define the decade's realist crime cinema before he moved into glossier studio comedy.

films:
