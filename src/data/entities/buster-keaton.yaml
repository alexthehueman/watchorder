  - film: go-west
    signature: 3
    gateway: 3
    note: The one where the joke is loneliness. He plays it entirely without winking, and it is stranger than the famous ones.

  - film: college
    signature: 3
    gateway: 4
    note: Sports gags, competently. The least essential of the features and still better made than most comedies.

  - film: battling-butler
    signature: 2
