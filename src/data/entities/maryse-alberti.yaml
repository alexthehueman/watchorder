slug: maryse-alberti
kind: cinematographer
name: Maryse Alberti
blurb: A pioneering female cinematographer whose documentary background gave her narrative work a grounded, handheld realism — the first contemporary woman DP featured on the cover of American Cinematographer.

films:
  - film: the-wrestler
    signature: 5
    must_see: true
    gateway: 1
    note: An aging wrestler's decline is shot on grainy 16mm with real documentary handheld immediacy, following him from behind like a camera crew that just happens to be there.

  - film: velvet-goldmine
    signature: 4
    must_see: true
    gateway: 3
    note: A glam-rock star's staged disappearance is investigated in a fractured, Citizen Kane-style structure, shot with theatrical glitter that never settles into one clean truth.

  - film: crumb
    signature: 4
    gateway: 2
    note: A documentary portrait of the cartoonist R. Crumb keeps complicating its own reading of the man rather than settling on any single verdict.

  - film: poison
    signature: 3
    gateway: 3
    note: Three genre-shifting stories — tabloid documentary, prison romance, 1950s horror pastiche — are shot in three distinct visual registers the film never explains the connections between.

curated:
  curator: house
  rationale: The two landmark achievements first, then the range around them.
  order:
    - the-wrestler
    - velvet-goldmine
    - crumb
    - poison
