    signature: 5
    must_see: true
    gateway: 2
    note: The Algerian War for independence restaged with such newsreel-plain camerawork that it was mistaken for real documentary footage on release.

  - film: burn
    signature: 4
    gateway: 2
    note: A British agent engineers a slave revolt to install a puppet government on a Caribbean island, then returns years later to help crush the same movement he created.

