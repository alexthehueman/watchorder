slug: paul-thomas-anderson
kind: director
name: Paul Thomas Anderson
blurb: Ensembles, obsessives, and men who cannot stop talking at each other.

films:
  - film: there-will-be-blood
    signature: 5
    must_see: true
    gateway: 5
    note: Oil, faith and contempt. The final scene is a comedy and nobody admits it.

  - film: magnolia
    signature: 5
    gateway: 4
    note: Three hours, nine stories and total sincerity. It either lands or it does not.

  - film: the-master
    signature: 5
    gateway: 3
    note: Not really about Scientology. About needing someone to tell you what you are.

  - film: phantom-thread
    signature: 5
    gateway: 4
    note: A romance in which both people are correct to behave appallingly.

  - film: one-battle-after-another
    signature: 5
    gateway: 5      # movie stars and a chase-movie plot — maybe the most accessible entry point he's made
    note: A father's revolutionary past comes hunting for his daughter, played as chase movie and satire at once — and, unexpectedly, his warmest ending in years.

  - film: boogie-nights
    signature: 4
    must_see: true
    gateway: 5      # the most purely enjoyable entry point in the roster
    note: The seventies porn industry as a family that cannot hold together.

  - film: punch-drunk-love
    signature: 4
    gateway: 4
    note: Sandler, used properly. Ninety-five minutes and not one of them relaxed.

  - film: inherent-vice
    signature: 4
    gateway: 1      # the plot does not resolve, and is not trying to
    note: Stoned noir. Give up on the plot early and it becomes very funny.

  - film: licorice-pizza
    signature: 3
    gateway: 4
    note: Loose, warm, and structurally almost nothing. Deliberately.

  - film: hard-eight
    signature: 3
    gateway: 3
    note: The first one, and a tighter film than anything he made after.

curated:
  curator: house
  rationale: Start with the loudest, then watch him get quieter and stranger.
  order:
    - one-battle-after-another
    - boogie-nights
    - there-will-be-blood
    - magnolia
    - punch-drunk-love
    - the-master
    - phantom-thread
    - inherent-vice
