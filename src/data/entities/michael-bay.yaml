    signature: 5
    must_see: true
    gateway: 5
    note: A disgraced ex-con who's the only man to ever escape Alcatraz has to break back into the prison, now held by rogue Marines with chemical weapons, alongside an FBI chemist with no field experience.

  - film: armageddon
    signature: 5
    must_see: true
    gateway: 4
    note: NASA recruits a crew of oil drillers, not astronauts, to fly to an asteroid the size of Texas and drill it open before it wipes out life on Earth.

  - film: bad-boys
    signature: 4
    gateway: 5
    note: Two mismatched Miami narcotics detectives have to recover a shipment of stolen heroin before internal affairs shuts their unit down, and switch identities along the way for reasons that keep making things worse.

