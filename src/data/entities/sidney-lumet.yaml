  - film: dog-day-afternoon
    signature: 4
    gateway: 4
    note: A bank robbery goes wrong in the first five minutes and turns into a hostage standoff, a media circus, and a folk hero, all before lunch.

  - film: serpico
    signature: 4
    gateway: 4
    note: An honest cop refuses to take payoffs, and finds out exactly how a department punishes an officer for that.

  - film: the-verdict
    signature: 4
    gateway: 3
