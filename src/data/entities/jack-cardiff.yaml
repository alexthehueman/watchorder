slug: jack-cardiff
kind: cinematographer
name: Jack Cardiff
blurb: The definitive early master of three-strip Technicolor, whose saturated, painterly command of color for Powell and Pressburger set the standard the format was named for — an Oscar winner who later shot everyone from Hitchcock to Marilyn Monroe.

films:
  - film: black-narcissus
    signature: 5
    must_see: true
    gateway: 2
    note: Nuns in a Himalayan convent are undone by altitude and isolation, shot in Technicolor so saturated it makes repression itself feel like it's curdling into madness — his Oscar-winning signature achievement.

  - film: the-red-shoes
    signature: 5
    must_see: true
    gateway: 2
    note: A ballerina torn between the stage and love is shot in color so vivid the title shoes themselves seem to make the choice for her.

  - film: a-matter-of-life-and-death
    signature: 4
    gateway: 2
    note: A dying WWII airman is put on trial in the afterlife, the color world of Earth and the monochrome afterlife kept visually and philosophically distinct.

  - film: the-african-queen
    signature: 3
    gateway: 1
    note: A missionary and a riverboat captain navigate German East Africa during WWI, shot with real location grandeur rather than studio backdrop.

  - film: the-barefoot-contessa
    signature: 2
    gateway: 2
    note: A Spanish dancer discovered and molded into a Hollywood star has her rise and death recounted in flashback, shot with glossy studio-era polish.

  - film: the-prince-and-the-showgirl
    signature: 2
    gateway: 1
    note: A Balkan regent's dalliance with a London showgirl during a coronation is shot with lush, comfortable studio gloss.

  - film: under-capricorn
    signature: 2
    gateway: 3
    note: A colonial-Australia household's buried secret is withheld through several extended, elaborately choreographed single-take scenes.

  - film: the-vikings
    signature: 3
    gateway: 2
    note: A Norse warlord's sons feud over a kingdom and a captive princess, shot on location in real Norwegian fjords rather than studio backlots.

  - film: rambo-first-blood-part-ii
    signature: 1
    gateway: 4
    note: A late-career pivot into pure action spectacle, three decades after Black Narcissus, shot with the same technical facility applied to a genre he'd never worked in before.

  - film: death-on-the-nile-1978
    signature: 2
    gateway: 3
    note: An all-star ensemble murder mystery on a Nile steamboat, whose true killer stays a live question until Poirot's final gathering of suspects.

curated:
  curator: house
  rationale: The two landmark Technicolor achievements first, then the range around them.
