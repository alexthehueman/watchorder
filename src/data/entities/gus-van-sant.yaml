    signature: 3
    must_see: true
    gateway: 1
    note: A janitor at MIT with an unacknowledged genius for mathematics is pushed into therapy after solving a graduate-level problem left on a hallway blackboard.

  - film: milk
    signature: 3
    gateway: 2
    note: San Francisco's first openly gay elected official builds a movement and a coalition in the years before his assassination.

  - film: paranoid-park
    signature: 4
    gateway: 3
    note: A teenage skater withholds and slowly reassembles, out of order, his own account of a stranger's accidental death.

  - film: psycho-1998
    signature: 3
    gateway: 3
    note: A near shot-for-shot color remake of Hitchcock's original, less a reinterpretation than an experiment in whether style alone can still unsettle.

