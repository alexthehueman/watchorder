slug: gus-van-sant
kind: director
name: Gus Van Sant
blurb: A director who moves freely between earnest mainstream drama and austere formal experiments, sometimes both within the same year — a shot-for-shot Psycho remake sits in his filmography beside two Palme d'Or-nominated slow-cinema studies of teenage death.

films:
