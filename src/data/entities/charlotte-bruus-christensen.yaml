slug: charlotte-bruus-christensen
kind: cinematographer
name: Charlotte Bruus Christensen
blurb: A Danish cinematographer trained in Dogme 95's emphasis on story and character over visual flourish, known for bringing a distinctly female gaze to her frequent collaborations with Thomas Vinterberg and later mainstream American features.

