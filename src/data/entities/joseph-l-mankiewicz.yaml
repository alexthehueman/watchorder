    note: A wealthy widow pressures a surgeon to lobotomize her niece to silence her account of what really happened to her cousin the summer he died, and the truth comes out only in pieces.

  - film: no-way-out-1950
    signature: 3
    gateway: 3
    note: A young Black doctor treats a violently racist criminal's brother, who dies on the table, and has to prove the death wasn't murder while the man's family incites a race riot against him.

