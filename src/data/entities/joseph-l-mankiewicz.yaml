slug: joseph-l-mankiewicz
kind: director
name: Joseph L. Mankiewicz
blurb: A screenwriter's director whose wit was the whole engine — dialogue sharp enough to double as a weapon, deployed on people far too smart to see the blade coming.

films:
  - film: all-about-eve
    signature: 5
    must_see: true
    gateway: 4
    note: An aging Broadway star takes a devoted young fan under her wing as an assistant, only to watch the girl maneuver, smile by smile, toward stealing her career, her friends, and her stage.

  - film: guys-and-dolls
    signature: 3
    gateway: 5
    note: A big-time gambler bets he can take a straitlaced missionary to Havana, and finds the sure thing isn't nearly as sure as he thought once he actually starts falling for her.

  - film: julius-caesar-1953
    signature: 3
    gateway: 2
    note: A group of Roman senators convinced Caesar's growing power threatens the republic conspire to assassinate him, and then have to survive the funeral oration of the one ally they let live.

  - film: suddenly-last-summer
    signature: 4
