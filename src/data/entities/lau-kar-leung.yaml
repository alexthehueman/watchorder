slug: lau-kar-leung
kind: director
name: Lau Kar-leung
blurb: A Shaw Brothers-era martial arts choreographer turned director whose real subject was always technique itself — the punishing discipline, lineage, and philosophy underneath the fights.

films:
  - film: the-36th-chamber-of-shaolin
    signature: 5
    must_see: true
    gateway: 4
    note: A young man whose family is killed by corrupt soldiers flees to the Shaolin temple and works his way, chamber by grueling chamber, through its entire martial arts curriculum to earn the skill to avenge them.

  - film: executioners-from-shaolin
    signature: 4
    gateway: 3
    note: A Shaolin survivor marries a woman skilled in a rival style and has a son caught between both martial traditions, all while hunting the man who slaughtered his temple and killed his master.

  - film: the-8-diagram-pole-fighter
    signature: 4
    gateway: 2
    note: The sole surviving son of a general's family ambushed by traitors fakes madness to survive at a monastery, quietly mastering a monk's pole-fighting style while deciding whether he can face what happened to his family at all.

  - film: my-young-auntie
    signature: 3
    gateway: 3
    note: A young widow inherits her late husband's estate and moves in with his extended family, and has to out-fight and out-maneuver a rival branch of the family scheming to take the inheritance from her.

  - film: dirty-ho
    signature: 3
    gateway: 4
    note: A wandering prince travels incognito, protected from constant assassination attempts by a skilled thief who doesn't yet realize who he's actually agreed to guard.

  - film: legendary-weapons-of-china
    signature: 2
