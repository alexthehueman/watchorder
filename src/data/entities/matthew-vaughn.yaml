slug: matthew-vaughn
kind: director
name: Matthew Vaughn
blurb: A British genre stylist who moves between glossy blockbuster spectacle and hard-edged crime with the same confident, slightly self-aware wink — everything shot like it knows exactly how fun it's supposed to be.

films:
