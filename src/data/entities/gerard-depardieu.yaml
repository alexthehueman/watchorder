    signature: 5
    showcase: 5
    must_see: true
    role_size: lead
    register: warm
    gateway: 3
    note: A brilliant swordsman and poet too insecure about his nose to say what he means. His most acclaimed performance, played almost entirely in verse.

  - film: jean-de-florette
    signature: 5
    showcase: 4
    must_see: true
    role_size: lead
    register: warm
    gateway: 3
    note: A hunchbacked outsider who moves his family to a farm his neighbors have secretly cut off from water, and dies trying to dig his way to some.

  - film: danton
    signature: 4
    showcase: 5
    role_size: lead
    register: unhinged
    gateway: 2
    note: A revolutionary hero played as a man drowning in his own conscience, opposite Robespierre, headed for the guillotine.

