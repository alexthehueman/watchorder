# The Godfather and The Godfather Part II are already tagged, under Brando and De Niro
# respectively; Heat is already tagged under De Niro. Only the relationships are new here.

slug: al-pacino
kind: actor
name: Al Pacino
blurb: Whisper to a shout across one career, and both registers entirely under control.

films:
  - film: the-godfather
    signature: 5
    must_see: true
    showcase: 5
    role_size: lead
    register: restrained
    gateway: 4
    note: Michael Corleone, arriving as the one son who wanted nothing to do with any of it.

  - film: the-godfather-part-ii
    signature: 4
    must_see: true
    showcase: 5
    role_size: lead
    register: menacing
    gateway: 2
    note: Michael again, and the film that finishes turning him into the thing he swore he wasn't.

  - film: dog-day-afternoon
    signature: 4
    showcase: 5
    role_size: lead
    register: comic
    gateway: 5
    note: A bank robbery that turns into a media circus, and he plays every register of it at once.

  - film: serpico
    signature: 4
    showcase: 4
    role_size: lead
    register: restrained
    gateway: 4
    note: An honest cop isolated by his own honesty. Quieter than the reputation suggests.

  - film: scarface
    signature: 4
    showcase: 3
    role_size: lead
    register: menacing
    gateway: 4
    note: Tony Montana, escalating past the point most films would call restraint.

  - film: glengarry-glen-ross
    signature: 3
    showcase: 4
    role_size: supporting
    register: comic
    gateway: 3
    note: A handful of scenes, entirely dialogue, and he steals the film out from under everyone.

  - film: scent-of-a-woman
    signature: 3
    showcase: 4
    role_size: lead
    register: warm
    against_type: true
    gateway: 5
    note: A blind, furious veteran who turns out to have real tenderness underneath the shouting.

  - film: the-insider
    signature: 3
    showcase: 3
    role_size: lead
    register: restrained
    gateway: 3
    note: A journalist under pressure, played entirely without the volume he is famous for.

  - film: heat
    signature: 3
    showcase: 3
    role_size: lead
    register: menacing
    gateway: 4
    note: One diner scene with De Niro that took decades of anticipation to arrange.

  - film: the-devils-advocate
    signature: 3
    showcase: 4
    role_size: lead
    register: comic
    against_type: true
    gateway: 4
    note: He plays Satan as a Manhattan lawyer, and is visibly having more fun than in anything else here.

  - film: and-justice-for-all
    signature: 3
    showcase: 3
    role_size: lead
    register: comic
    gateway: 4
    note: A defence lawyer forced to defend a judge he knows is guilty. Furious and, at points, absurd.

  - film: sea-of-love
    signature: 2
    showcase: 2
    role_size: lead
    register: restrained
    gateway: 3
    note: A weary cop drawn to the suspect in his own case. Minor, and quietly effective.

prereqs:
  - film: the-godfather-part-ii
    requires: the-godfather
    strength: hard

curated:
  curator: house
  rationale: Both Godfathers, since neither makes full sense without the other, then the range around them.
  order:
    - dog-day-afternoon
    - the-godfather
    - serpico
    - scarface
    - glengarry-glen-ross
    - the-godfather-part-ii
    - scent-of-a-woman
