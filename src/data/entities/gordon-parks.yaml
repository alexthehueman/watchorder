slug: gordon-parks
kind: director
name: Gordon Parks
blurb: A photographer first, who became the first Black director to helm a major Hollywood studio film — Black American life told from the inside, whether the register is autobiography, blues legend or blaxploitation cool.

films:
  - film: the-learning-tree
    signature: 4
    must_see: true
    gateway: 3
    note: A Black teenager coming of age in 1920s Kansas navigates racism, friendship and his own conscience, adapted from Parks's own semi-autobiographical novel.

  - film: shaft
    signature: 3
    gateway: 3
    note: A private detective navigates Harlem's mob politics to rescue a gangster's kidnapped daughter, launching the blaxploitation genre almost single-handedly.

  - film: leadbelly
    signature: 3
    gateway: 3
    note: A biography of the blues and folk musician Huddie Ledbetter, tracing his life from chain-gang imprisonment to his eventual recognition as a major American songwriter.

