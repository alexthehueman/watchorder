    gateway: 4
    note: A celebrated crime novelist is found dead the night of his eighty-fifth birthday, and a famous detective nobody hired starts working the case anyway.

  - film: brick
    signature: 5
    gateway: 1
    note: A high schooler investigates his ex-girlfriend's death by working his way into the school's drug underworld, treating every hallway and locker room like a hardboiled crime scene.

  - film: glass-onion
    signature: 4
    gateway: 4
    note: A tech billionaire invites his old friend group to his private Greek island for a murder-mystery weekend, and gets an actual murder instead of the game he planned.

  - film: looper
    signature: 4
    gateway: 3
    note: A contract killer who executes targets sent back from thirty years in the future has to decide what to do when his own future self shows up as the next job.

  - film: star-wars-the-last-jedi
    signature: 3
