slug: frank-lloyd
kind: director
name: Frank Lloyd
blurb: A prolific, now-underseen studio-era craftsman who won three Best Director Oscars across silent and early-sound Hollywood, most remembered today for mounting large-scale historical spectacle around a single moral crisis.

