    note: A tyrannical ship's captain drives his crew to open rebellion on the high seas, dramatized as much through the buildup of small cruelties as the mutiny itself.

  - film: cavalcade
    signature: 4
    gateway: 3
    note: A well-off London family's fortunes are tracked across three decades of British history, from the Boer War through the Titanic to the edge of a new war.

