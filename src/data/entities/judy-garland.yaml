# The Wizard of Oz, Meet Me in St. Louis and Easter Parade already existed in the corpus, tagged
# for MGM — the same free-overlap pattern the rest of this batch established. Ten films are new;
# see the note in src/data/films/garland.yaml for why the roster runs well past the minimum.

slug: judy-garland
kind: actor
name: Judy Garland
blurb: The MGM machine's biggest star, and a talent it never quite figured out how to protect.

films:
  - film: the-wizard-of-oz
    signature: 5
    must_see: true
    showcase: 5
    role_size: lead
    register: warm
    gateway: 4
    note: A Kansas farm girl swept into Oz, and the performance that made her a star before she was seventeen.

  - film: a-star-is-born-1954
    signature: 5
    must_see: true
    showcase: 5
    role_size: lead
    register: restrained
    against_type: true
    gateway: 2
    note: A rising star's marriage to a collapsing one, and the closest the studio ever let her get to the real cost of the persona.

  - film: judgment-at-nuremberg
    signature: 5
    showcase: 4
    role_size: supporting
    register: restrained
    against_type: true
    gateway: 2
    note: A brief, devastating turn as a Holocaust witness, in a film mostly built around other people's testimony.

  - film: meet-me-in-st-louis
    signature: 4
    showcase: 4
    role_size: lead
    register: warm
    gateway: 5
    note: The Freed Unit's first major statement, and the reason "Have Yourself a Merry Little Christmas" exists.

  - film: easter-parade
    signature: 3
    showcase: 3
    role_size: lead
    register: comic
    gateway: 4
    note: Paired with Astaire only because Kelly broke an ankle. Nobody involved seems to mind.

  - film: i-could-go-on-singing
    signature: 3
    showcase: 4
    role_size: lead
    register: menacing
    against_type: true
    gateway: 1
    note: Her final film — a fading star reckoning with an estranged son, close enough to her own life it stops feeling like acting.

  - film: in-the-good-old-summertime
    signature: 3
    showcase: 2
    role_size: lead
    register: comic
    gateway: 4
    note: Rival pen pals who don't know they work in the same shop, set to a Chicago music store instead of a Budapest one.

  - film: summer-stock
    signature: 3
    showcase: 2
    role_size: lead
    register: comic
    gateway: 4
    note: A farm owner reluctantly hosting a theatre troupe, mostly there for the "Get Happy" number at the end.

  - film: ziegfeld-girl
    signature: 3
    showcase: 4
    role_size: lead
    register: restrained
    gateway: 4
    note: One showgirl's descent into drink amid the Ziegfeld glamour, played with none of the era's usual softening.

  - film: the-harvey-girls
    signature: 4
    showcase: 3
    role_size: lead
    register: comic
    gateway: 5
    note: A trainload of waitresses civilises a Western frontier town, mostly by force of cheerful will.

  - film: a-child-is-waiting
    signature: 4
    showcase: 4
    role_size: lead
    register: restrained
    against_type: true
    gateway: 1
    note: A music therapist at a school for children with intellectual disabilities, played with none of her usual star wattage.

  - film: for-me-and-my-gal
    signature: 2
    showcase: 2
    role_size: lead
    register: warm
    gateway: 4
    note: A vaudeville double act pulled apart by the First World War, in her first adult lead role.

  - film: the-pirate
    signature: 2
    showcase: 2
    role_size: lead
    register: comic
    gateway: 4
    note: A travelling actor lets a smitten woman believe he's the pirate of her fantasies. Nobody plays it as remotely serious.

curated:
  curator: house
  rationale: The role everyone means, then the performance that shows what the studio image was covering for.
  order:
    - the-wizard-of-oz
    - a-star-is-born-1954
    - meet-me-in-st-louis
    - judgment-at-nuremberg
    - easter-parade
    - i-could-go-on-singing
    - in-the-good-old-summertime
