slug: oliver-stone
kind: director
name: Oliver Stone
blurb: Big, angry, conspiratorial American history — Vietnam, Wall Street, the JFK assassination — shot with a restless camera that never once pretends to be neutral.

films:
  - film: platoon
    signature: 5
    must_see: true
    gateway: 4
    note: A volunteer infantryman in Vietnam gets caught between two sergeants — one brutal and pragmatic, one humane and doomed — who represent the two ways the war can go.

  - film: jfk
    signature: 5
    must_see: true
    gateway: 2
    note: A New Orleans DA reopens the Kennedy assassination investigation, building a conspiracy case out of fractured footage, contradicting witnesses, and official records that don't add up.

  - film: wall-street
    signature: 4
    gateway: 5
    note: A hungry young stockbroker gets taken under the wing of a ruthless corporate raider, and has to decide how much of himself he's willing to trade for the lifestyle.

  - film: natural-born-killers
    signature: 4
    gateway: 2
    note: A young couple's cross-country murder spree turns them into tabloid celebrities, and the film's own hyperactive style becomes part of the media frenzy it's satirizing.

  - film: the-doors
    signature: 3
    gateway: 3
    note: Jim Morrison's rise with the Doors is told as one long hallucination, chasing the mythology he built around himself as much as the actual events of his life.

  - film: nixon
    signature: 3
    gateway: 2
    note: Richard Nixon's presidency is reconstructed from the inside, treating Watergate less as a scandal than as the final outcome of a lifetime of grievance and self-sabotage.

  - film: w
    signature: 2
    gateway: 3
    note: "George W. Bush's path from underachieving son to wartime president is traced back to one relationship he never stopped trying to win: his father's approval."

  - film: any-given-sunday
    signature: 2
    gateway: 4
    note: An aging pro football coach clashes with a brash young quarterback and a front office more interested in the franchise's value than the team's health.

  - film: world-trade-center
    signature: 2
    gateway: 3
    note: Two Port Authority officers are trapped in the rubble after the North Tower collapses on top of them, and the film follows both their fight to survive and their families' wait for news.

  - film: wall-street-money-never-sleeps
    signature: 1
    gateway: 2
    note: Years after prison, the original film's disgraced trader resurfaces during the 2008 financial crisis, working an angle involving his daughter's fiance that isn't entirely about reconciliation.

curated:
  curator: house
  rationale: The two films that define the reputation, then the range around them.
  order:
    - platoon
    - jfk
    - wall-street
    - natural-born-killers
    - the-doors
    - nixon
    - w
    - any-given-sunday
    - world-trade-center
    - wall-street-money-never-sleeps
