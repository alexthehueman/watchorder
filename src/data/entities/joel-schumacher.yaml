  - film: the-lost-boys
    signature: 4
    must_see: true
    gateway: 4
    note: A teenager who's just moved to a boardwalk town falls in with a gang of older kids who turn out to be vampires, and finding a way to undo it means figuring out who's already too far gone.

  - film: a-time-to-kill
    signature: 4
    gateway: 3
    note: A father is put on trial for killing the men who raped his young daughter, and his young defense lawyer has to persuade an all-white Mississippi jury that the killing was justice.

