slug: joel-schumacher
kind: director
name: Joel Schumacher
blurb: A glossy studio journeyman equally comfortable in pulpy thriller, teen cult classic, and prestige courtroom drama, never afraid of neon, melodrama, or a swing that doesn't land.

films:
