slug: mikio-naruse
kind: director
name: Mikio Naruse
blurb: A quiet master of Japanese domestic melodrama, obsessed with women worn down by marriage, poverty, and duty, filmed with a patience that never once tips into sentimentality.

films:
  - film: when-a-woman-ascends-the-stairs
    signature: 5
    must_see: true
    gateway: 2
    note: An aging Ginza bar hostess weighs marriage, her own bar, or an affair as her only paths out of a profession that's slowly running out of options for her, none of the three actually solving anything.

  - film: floating-clouds
    signature: 5
    gateway: 1
    note: A woman returns to postwar Tokyo still in love with a married man she had an affair with overseas, and keeps returning to him across years of his repeated betrayals and her own worsening circumstances.

  - film: sound-of-the-mountain
    signature: 4
    gateway: 2
    note: An aging man grows closer to his unhappily married daughter-in-law than to his own emotionally distant son, and has to face what that closeness means for a family quietly coming apart.

  - film: repast
    signature: 3
    gateway: 3
    note: A housewife in a financially strained, affectionless marriage seriously considers leaving her husband, and a visit from his flirtatious young niece forces the question to a head.

curated:
  curator: house
  rationale: The two films that define the reputation, then the range around them.
  order:
    - when-a-woman-ascends-the-stairs
    - floating-clouds
    - repast
    - sound-of-the-mountain
