slug: rko-radio-pictures
kind: studio
name: RKO Radio Pictures
blurb: The Golden Age major that gambled hardest on shadow and doubt — the home studio of both the greatest B-movie horror unit in Hollywood history and the film that's still argued about as the best ever made.

eras:
