  - film: notorious
    era: golden-age
    signature: 4
    gateway: 3
    note: A disgraced Nazi collaborator's daughter is recruited to infiltrate a ring of her father's former associates in Brazil, and has to marry one of them without her handler admitting how he actually feels about it.

  - film: cat-people
    era: golden-age
    signature: 4
    gateway: 1
    note: A newlywed convinced she carries an ancestral curse that turns her into a panther when aroused avoids consummating her marriage, and the film never settles whether the threat is real or entirely in her mind.

  - film: out-of-the-past
    era: golden-age
    signature: 4
    gateway: 2
    note: A private eye who buried his old life running a small-town gas station is dragged back by the one client he never fully escaped, and every choice from there closes off one more way out.

  - film: the-magnificent-ambersons
    era: golden-age
    signature: 3
    gateway: 2
    note: A wealthy Midwestern family's fortune and social standing quietly collapse across a generation, while the pampered heir remains the last person in the family to notice it happening.

  - film: its-a-wonderful-life
    era: golden-age
    signature: 3
    gateway: 4
    note: A man who's spent his whole life sacrificing his own dreams for his small town is shown, by an angel sent to stop his suicide, what the town would have become if he'd never been born at all.

